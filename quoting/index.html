<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5FA">
<title>What do slow quotes cost you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F3F5FA; --card:#FFFFFF; --ink:#0A0F2C; --muted:#4B5270;
  --rule:#DDE1EC; --rule2:#C3C9DC;
  --acc:#2A3BF5; --acc-soft:#E7EAFE; --acc-ink:#FFFFFF;
  --lime:#D7FF3F; --night:#0A0F2C; --warn-soft:#FFF1D6;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --sans:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.page{min-height:100vh;overflow-x:clip}
a{color:inherit}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1108px;margin:0 auto;
  height:calc(72px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 24px 0}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-name{font:700 22px/1 var(--display);letter-spacing:-.025em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;grid-template-columns:repeat(2,auto);place-content:center;gap:4px}
.pill{width:7px;height:7px;border-radius:50%;background:#FFFFFF}
.pill.lime{background:var(--lime)}
.home{white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:15px;color:var(--muted);text-decoration:none}
.home:hover{color:var(--acc)}

main{max-width:1108px;margin:0 auto;padding:8px 24px 64px}
h1{font:700 clamp(28px,4.2vw,40px)/1.08 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.dek{font-size:16px;line-height:1.5;color:var(--muted);margin:8px 0 0;max-width:68ch}
.dek b{color:var(--ink);font-weight:600}
/* three steps down the page, each with its own part of the result beside it */
.stepx{padding:32px 0;border-top:1px solid var(--rule)}
.stepx:first-of-type{border-top:0;padding-top:22px}
.stepx-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.stepx-h b{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font:700 15px/1 var(--display)}
.stepx-h h2{margin:3px 0 0;font:700 22px/1.2 var(--display);letter-spacing:-.02em}
.stepx-h p{margin:4px 0 0;font-size:14.5px;line-height:1.45;color:var(--muted)}
.stepx-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start}
.stepx-r{display:flex;flex-direction:column;gap:16px}
.stepx-end{display:flex;flex-direction:column;gap:14px;max-width:560px}
.now{margin:0 0 14px;font-size:14px;color:var(--muted)}
.now b{font:700 26px/1 var(--display);letter-spacing:-.02em;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}

/* what they set */
.ctl{padding:16px 0;border-top:1px solid var(--rule)}
.ctl:first-of-type{border-top:0;padding-top:4px}
.ctl-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.ctl-top label,.ctl-top .lk{font:600 16.5px/1.35 var(--sans)}
.ctl-top output{font:700 19px/1.2 var(--display);color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.ctl-note{font-size:13.5px;color:var(--muted);margin:4px 0 0;line-height:1.45}
.ctl-note:empty{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:32px;margin:8px 0 0;background:transparent;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:8px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--acc) var(--p,50%),var(--rule) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#FFFFFF;border:3px solid var(--acc);box-shadow:0 2px 8px rgba(10,15,44,.22)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--rule)}
input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#FFFFFF;border:3px solid var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:44px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--rule2);background:var(--card);color:var(--ink);
  font:600 15px/1.25 var(--sans);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.chip small{font-weight:500;color:var(--muted);margin-left:4px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.on small{color:rgba(255,255,255,.75)}
.chips.multi .chip.on{background:var(--acc-soft);color:var(--ink);border-color:var(--acc)}
.chips.multi .chip.on::before{content:"✓";color:var(--acc);font-weight:700;margin-right:6px}
/* who does the quoting, as three stops in one row under the hour slider,
   evenly spaced: the slider's scale bends so each sits under its own rate */
.stops{position:relative;height:62px;margin-top:2px}
.stop{position:absolute;top:0;left:calc(13px + (100% - 26px) * var(--f));transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center}
.stop::before{content:"";width:2px;height:8px;border-radius:2px;background:var(--rule2)}
.stop button{display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap;padding:6px 12px;border-radius:14px;
  border:1.5px solid var(--rule2);background:var(--card);color:var(--ink);font:600 13px/1.2 var(--sans);cursor:pointer;
  transition:background .2s,border-color .2s,color .2s}
.stop button small{font-weight:500;font-size:12px;color:var(--muted)}
.stop button:hover{border-color:var(--ink)}
.stop.on::before{background:var(--acc)}
.stop.on button{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.stop.on button small{color:rgba(255,255,255,.75)}
.stop button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chip:focus-visible,.row-head:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:3px}

/* our guesses, one line each */
.rows{background:var(--card);border:1.5px solid var(--rule);border-radius:20px;overflow:hidden}
.rows.unlock{border-color:color-mix(in srgb,var(--acc) 45%,var(--rule))}
.row + .row{border-top:1px solid var(--rule)}
.row-head{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center;width:100%;min-height:60px;
  padding:12px 18px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row-head:hover .row-edit{text-decoration:underline}
.row-q{font-size:13.5px;line-height:1.3;color:var(--muted)}
.row-a{font-size:16px;line-height:1.35;font-weight:600;margin-top:2px}
.row-a .why{font-weight:400;color:var(--muted);font-size:14px}
.tag{display:inline-block;font:700 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 7px;margin-right:8px;
  vertical-align:2px;color:var(--muted);background:var(--paper);border:1px solid var(--rule)}
.row.yours .tag{color:var(--acc);background:var(--acc-soft);border-color:transparent}
.row-edit{grid-column:2;grid-row:1 / span 2;font-weight:600;font-size:14.5px;color:var(--acc)}
.row.open .row-head{background:var(--paper)}
.row-body{padding:2px 18px 16px;background:var(--paper)}
.row-body .chips{margin-top:0}
.done{margin-top:12px}

/* right: the number and what it means */
.card{background:var(--night);color:#FFFFFF;border-radius:24px;padding:24px 24px 20px;display:flex;flex-direction:column}
.year{display:inline-block;transform-origin:left center;font:700 clamp(44px,6vw,64px)/1 var(--display);letter-spacing:-.02em;color:var(--lime);font-variant-numeric:tabular-nums}
.year.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.035)}}
.lab{font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.75);margin-top:6px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}
.pair b{font:700 22px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pair b small{font:600 12px/1 var(--sans);letter-spacing:0;color:rgba(255,255,255,.6);margin-left:4px}
.lock{padding:14px 16px;border-radius:16px;border:1px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.06);transition:background .3s}
.lock.open{background:var(--acc);border:1px solid var(--acc)}
/* in step 3 the locked figure is a card of its own: dashed while locked, blue once open */
.card.lock{padding:22px 24px;border-radius:24px;border:1px dashed rgba(10,15,44,.35);background:var(--night)}
.card.lock.open{border:1px solid var(--acc);background:var(--acc)}
.lock-h{font:700 12px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.lock-v{font:700 22px/1.2 var(--display);letter-spacing:-.01em;margin-top:8px}
.lock.open .lock-v{font-size:30px}
.lock-n{font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.82);margin-top:6px}
.dots{display:flex;gap:6px;margin-top:10px}
.dots i{width:24px;height:6px;border-radius:99px;background:rgba(255,255,255,.22)}
.dots i.on{background:var(--lime)}
.lock.open .dots{display:none}
.box{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:16px 20px 18px}
.box h3{font:700 12px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.bar{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr auto;gap:10px;align-items:center;font-size:14px;margin-top:8px}
.track{height:10px;border-radius:99px;background:var(--acc-soft);overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar span:last-child{font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5}
.flag b{display:block;margin-bottom:2px}
.flags{display:flex;flex-direction:column;gap:10px}
.flags:empty{display:none}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 22px;border:0;border-radius:14px;
  background:var(--acc);color:var(--acc-ink);font:700 16px/1.25 var(--sans);text-decoration:none;cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.btn:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 0 var(--ink)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule2)}
.btn.alt:hover{box-shadow:inset 0 0 0 1.5px var(--ink),5px 5px 0 0 var(--ink)}
.btn.small{min-height:44px;padding:8px 18px;font-size:15px}
.trust{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trust li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;font-size:14px;line-height:1.5;color:var(--muted)}
.trust li::before{content:"✓";color:var(--acc);font-weight:700}
.trust b{color:var(--ink);font-weight:600}
.fine{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
.btn[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:none}
/* the written result: a short form that opens in place */
.mail{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:16px 18px}
.mail-h{font:700 16px/1.3 var(--display);margin:0}
.mail input{width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;font:500 16px/1.3 var(--sans)}
.mail input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.mail input.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.mail-err{margin:0;font-size:14px;color:#B42318}
.sent{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:16px 18px;font-size:15px;line-height:1.5}
.sent b{display:block;font:700 17px/1.3 var(--display);margin-bottom:4px}
.foot{max-width:1108px;margin:0 auto;padding:0 24px calc(40px + env(safe-area-inset-bottom,0px));font-size:13px;line-height:1.65;color:var(--muted)}

/* phone: the number rides along at the top from the start */
.mbar{display:none}
@media(max-width:860px){
  .stepx-body{grid-template-columns:minmax(0,1fr);gap:20px}
  .stepx{padding:26px 0}
  main{padding-left:20px;padding-right:20px}
  .top{padding-left:20px;padding-right:20px}
  .mbar{display:flex;position:sticky;top:0;z-index:30;align-items:baseline;gap:10px;margin:14px -20px 0;padding:10px 20px;
    background:var(--night);color:#FFFFFF;box-shadow:0 14px 30px -18px rgba(10,15,44,.7)}
  .mbar b{font:700 26px/1 var(--display);letter-spacing:-.02em;color:var(--lime);font-variant-numeric:tabular-nums}
  .mbar span{font-size:13px;color:rgba(255,255,255,.7)}
  .mbar em{margin-left:auto;font:700 15px/1 var(--display);font-style:normal;font-variant-numeric:tabular-nums}
  .year{font-size:44px}
}
@media(max-width:520px){.stop button{padding:6px 9px;font-size:12.5px}.brand-name{font-size:20px}.bar{grid-template-columns:1fr auto;gap:4px 10px}.track{grid-column:1 / 3;order:3}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page">
<header class="top">
  <a class="brand" data-home href="../" aria-label="fourtaps home"><span class="logo" aria-hidden="true"><span class="pill"></span><span class="pill"></span><span class="pill"></span><span class="pill lime"></span></span><span class="brand-name">fourtaps</span></a>
  <a class="home" data-home href="../">← Home</a>
</header>
<main id="app"></main>
<footer class="foot">Task shares come from 870 Canadian businesses that advertised a quoting or estimating seat in July and August 2026. What you set goes to fourtaps as you change it; your name and email only if you give them.</footer>
</div>

<script>
window.WEDGE = (function () {
  var TASKS = {
    price:     { label: "Pricing it up",            rem: .85, hint: "Looking every line up — the single biggest task in the job" },
    scope:     { label: "Reading the scope & specs", rem: .60, hint: "Drawings, quantities, what is actually being asked for" },
    prepare:   { label: "Writing the quote",        rem: .90, hint: "Filling the template, applying the margin rules" },
    intake:    { label: "Taking the request in",    rem: .80, hint: "Reading the inbox, the portal, the voicemail" },
    chase:     { label: "Sending & following up",   rem: .85, hint: "The part everyone drops when the week gets busy" },
    record:    { label: "Logging it afterwards",    rem: .90, hint: "The CRM, the spreadsheet, the job file" },
    negotiate: { label: "Negotiating & closing",    rem: .15, hint: "The relationship half — this one stays human" }
  };
  var RATE = { owner: 90, estimator: 32, sales: 38, shared: 40 };
  var RATE_HINT = {
    owner: "Owners usually value their hour at what it earns elsewhere — $75–120 is typical.",
    estimator: "Median stated estimator wage in Canadian postings is about $27/hr; $32 all-in with overhead.",
    sales: "Sales or account staff quoting between calls — $35–45/hr all-in is typical.",
    shared: "Shared across a few people — use the average of what those hours cost you."
  };
  return {
    sheet: "/api/results",
    wedge: "W2",
    trust: [   // only what is true today; tools by name, never their logos
      "<b>Measured, not guessed:</b> job ads from 870 Canadian businesses hiring estimators, July and August 2026.",
      "<b>Works with what you use:</b> Excel, Google Sheets, Outlook, Gmail, QuickBooks and Xero. Nothing to replace."
    ],
  intro: {
    title: "What do slow quotes cost you?",
    dek: "Across 870 Canadian businesses hiring estimators, the heaviest part of the job is not writing the quote &mdash; it is <b>looking the numbers up</b>. Set your week below and watch what it costs."
  },
    questions: [
      { id: "who", type: "choice", ask: "Who puts the quotes together?",
        sets: function (v) { return { rate: RATE[v] }; },
        options: [
          { value: "owner", label: "Me", hint: "The most common answer under 20 staff" },
          { value: "estimator", label: "A dedicated estimator", chip: "An estimator" },
          { value: "sales", label: "Sales or account staff, between other things", chip: "Sales staff" },
          { value: "shared", label: "Whoever is free that day", chip: "Whoever is free" } ] },
      { id: "quotes", type: "choice", numeric: true,
        slider: { min: 1, max: 80, step: 1, start: 10,
          show: function (v) { return v + (v === 1 ? " quote" : " quotes"); } },
        ask: "How many quotes go out in a week?",
        note: "Everything that leaves with a price on it, however small.",
        options: [
          { value: 3, label: "Under 5" },
          { value: 10, label: "5 to 15" },
          { value: 22, label: "15 to 30" },
          { value: 45, label: "30 to 60" },
          { value: 80, label: "More than 60" } ] },
      { id: "hoursEach", type: "choice", numeric: true,
        slider: { min: 0.5, max: 10, step: 0.5, start: 1.5,
          show: function (v) { return v < 1 ? "30 minutes" : v + (v === 1 ? " hour" : " hours"); } },
        ask: "How long does one take, start to finish?",
        note: "From the request landing to the number going back out.",
        options: [
          { value: 0.5, label: "Under an hour", hint: "Counter or catalogue pricing" },
          { value: 1.5, label: "One to two hours" },
          { value: 3, label: "Two to four hours" },
          { value: 6, label: "Half a day" },
          { value: 10, label: "A full day or more", hint: "Plan sets, tenders, big fabrication" } ] },
      { id: "rate", type: "choice", numeric: true,
        ask: "What is that hour worth?",
        note: function (a) { return RATE_HINT[a.who] || RATE_HINT.shared; },
        options: function (a) {
          var bands = a.who === "owner"
            ? [[50, "$50 an hour"], [90, "$90 an hour", "typical for an owner"], [130, "$130 an hour"], [200, "$200 or more"]]
            : [[27, "About $27 an hour"], [RATE[a.who] || 38, "About $" + (RATE[a.who] || 38) + " an hour", "the market rate all-in"],
               [55, "About $55 an hour"], [80, "$80 or more"]];
          return bands.map(function (b) { return { value: b[0], label: b[1], hint: b[2] }; });
        } },
      { id: "priceSrc", type: "choice", ask: "When you price something, where do the numbers come from?",
        note: "This is the question that decides whether any of it works.",
        options: [
          { value: "catalogue", label: "A supplier catalogue or an internal price list", chip: "A catalogue or price list", hint: "A system can look these up directly" },
          { value: "past", label: "Past jobs, or a spreadsheet we keep", chip: "Past jobs or a spreadsheet", hint: "Extractable, with one pass of tidying" },
          { value: "rep", label: "I call the supplier rep", hint: "The price is a relationship — harder" },
          { value: "head", label: "It's in my head", hint: "Honest, and the most common answer" } ] },
      { id: "tasks", type: "multi",
        ask: "Which of these happen on every quote?",
        note: "Untick anything that isn't part of your process. Each one is removable to a different degree, so this changes the answer.",
        options: Object.keys(TASKS).map(function (k) {
          return { value: k, label: TASKS[k].label, hint: TASKS[k].hint }; }) },
      { id: "intake", type: "choice", ask: "How do the requests arrive?",
        options: [
          { value: "email", label: "Email, mostly with attachments", chip: "Email with attachments" },
          { value: "portal", label: "A bid portal or tender site", chip: "A bid portal", hint: "Structured input on a deadline — the best case" },
          { value: "drawings", label: "Drawings and plan sets" },
          { value: "mixed", label: "A mix of email and phone" },
          { value: "phone", label: "Mostly phone", hint: "Somebody still has to write it down" } ] },
      { id: "turnaround", type: "choice", ask: "How long does the customer usually wait?",
        options: [
          { value: "same", label: "Same day" },
          { value: "d2", label: "One or two days" },
          { value: "d5", label: "Three to five days" },
          { value: "week", label: "A week or more", hint: "This is where jobs quietly go elsewhere" } ] },
      { id: "lost", type: "choice", ask: "Have you lost work because the quote went out late?",
        options: [
          { value: "often", label: "Yes — regularly" },
          { value: "some", label: "Once or twice that I know of" },
          { value: "no", label: "No" },
          { value: "dunno", label: "No idea, honestly", hint: "Very common — almost nobody tracks it" } ] },
      { id: "jobValue", type: "choice", numeric: true,
        ask: "What is an average job worth to you?",
        note: "Revenue, not profit. This is what turns hours into a number worth acting on.",
        options: [
          { value: 1200, label: "Under $2,000" },
          { value: 5000, label: "$2,000 to $10,000" },
          { value: 25000, label: "$10,000 to $50,000" },
          { value: 120000, label: "$50,000 to $250,000" },
          { value: 400000, label: "More than $250,000" } ] },
      { id: "scope", type: "choice", ask: "Besides quoting, what else does that person do?",
        note: "The honest answer here is worth more than any number above it.",
        options: [
          { value: "none", label: "Nothing — quoting is the job" },
          { value: "some", label: "Some sales, some scheduling, some admin" },
          { value: "lots", label: "They run half the business — quoting is one part of the day" } ] }
    ],
    compute: function (a) {
      var quotes = Math.max(0, +a.quotes || 0);
      var each   = Math.max(0, +a.hoursEach || 0);
      var total  = quotes * each;
      var rate   = Math.max(1, +a.rate || 40);
      var price  = { catalogue: 1, past: .8, rep: .5, head: .32 }[a.priceSrc] || .6;
      var intake = { email: 1, portal: 1, drawings: .85, mixed: .72, phone: .45 }[a.intake] || .75;
      var sel = (a.tasks || []).filter(function (k) { return TASKS[k]; });
      if (!sel.length) sel = ["price"];
      var per = total / sel.length, freed = 0, bars = [];
      sel.forEach(function (k) {
        // pricing is gated by where the prices live; intake by how requests arrive
        var gate = k === "price" ? price
                 : k === "intake" ? intake
                 : k === "scope" ? (intake * .5 + .5)
                 : 1;
        var h = per * TASKS[k].rem * gate;
        freed += h; bars.push({ label: TASKS[k].label, hours: h });
      });
      bars.sort(function (x, y) { return y.hours - x.hours; });
      var annual = freed * rate * 52, residual = Math.max(0, total - freed);
      var owner = a.who === "owner";

      // revenue half — conservative, and zero where they told us lateness costs nothing
      var recov = { often: 1, some: 0.5, no: 0, dunno: 0.35 }[a.lost];
      if (recov == null) recov = 0.35;
      var slow  = { same: .4, d2: .8, d5: 1.2, week: 1.6 }[a.turnaround] || 1;
      var upside = Math.max(0, +a.jobValue || 0) * recov * slow * 12;

      var flags = [];
      if (a.priceSrc === "head" || a.priceSrc === "rep")
        flags.push({ tone: "warn", title: "Your prices do not live anywhere a system can read.",
          body: "You told us they are in your head, or on the phone with a rep. That has to come out first, and it is a project of its own — we would quote it separately rather than fold it in and hope. Anyone who tells you otherwise has not built one." });
      if (a.intake === "phone")
        flags.push({ tone: "warn", title: "Phone-only requests are the real blocker.",
          body: "Somebody still has to write down what was asked for, and that somebody is a person. We would automate the second half of the job and the seat would stay — which is not what you are paying for. An email or web-form route in front of it fixes this cheaply." });
      if (a.scope === "lots")
        flags.push({ tone: "warn", title: "Quoting is one part of that person's day.",
          body: "Taking the quoting out shrinks the job, it does not remove the seat. The hours above are still real; the salary line is not the argument to make here." });
      else if (a.scope === "some")
        flags.push({ title: "Part of this role sits outside quoting.",
          body: "The lookup work goes; the sales and scheduling do not. That usually means more quoting capacity from the same person rather than one fewer person." });
      if (a.turnaround === "week" || a.turnaround === "d5")
        flags.push({ title: "Your turnaround is where the money is, not your payroll.",
          body: "At three days and up, the fastest quote in the inbox is usually not yours. That is a revenue argument, and it is a stronger one than the hours." });

      var ptline = "";
      if (owner && freed >= 5) ptline = "Those are your evenings, not a salary line.";
      else if (!owner && residual > 0 && residual <= 12)
        ptline = "What is left is a few hours a day — usually absorbed, not hired for.";

      return {
        freed: freed, monthly: annual / 12, annual: annual, total: total, residual: residual,
        bars: bars, flags: flags, ptline: ptline,
        labels: {
          hours:   owner ? "hours a week back in your hands" : "hours a week of lookup work",
          monthly: owner ? "a month of capacity, at what your hour earns" : "a month, at your stated rate",
          annual:  owner ? "a year of earning capacity" : "a year in quoting time"
        },
        extra: upside > 0 ? {
          label: "And the other half",
          value: "$" + Math.round(upside).toLocaleString("en-CA") + " a year",
          note: "if same-day quoting recovers the work you currently lose to being late. Built from your own answers: an average job at " +
                "$" + Math.round(+a.jobValue || 0).toLocaleString("en-CA") + ", and how often you told us lateness has cost you one."
        } : {
          label: "And the other half",
          value: "Not estimated",
          note: "You told us lateness has not cost you work, so we are not going to invent a revenue figure. The hours above stand on their own."
        },
        caveat: (a.priceSrc === "head" || a.priceSrc === "rep")
          ? "How long it takes to get the pricing out of your head. That is the whole project here, and it is the one thing we cannot size from a form — it depends on how many products, how many exceptions, and how much of it only you know."
          : "Whether faster quotes actually win more work. We can measure that your quoting time is mostly lookup; we cannot measure your win rate, and most shops have never counted it. The revenue figure is a hypothesis from your own answers — worth testing, not worth banking."
      };
    },
    headline: function (r) {
      var up = r.extra && r.extra.value !== "Not estimated";
      return (up && r.annual < 40000) ? "The hours are the small half of this."
           : r.freed >= 18 ? "There is more than a full seat of lookup here."
           : r.freed >= 9  ? "There is a full part-time job in the lookup alone."
           : r.freed >= 4  ? "Modest hours — but the late ones still cost you."
                           : "Not much time. The turnaround is the thing to look at.";
    }
  };
})();
</script>
<script>
/* The quoting calculator on one page: three sliders, then our guesses for the
   rest, each a line the visitor can change, and three questions that unlock
   the work lost to slow quotes. The figures beside them change as they go.
   The sums are in window.WEDGE above; everything below is the page. */
(function () {
  const W = window.WEDGE, Q = W.questions;
  const byId = id => Q.find(q => q.id === id);
  const val = (q, k) => typeof q[k] === "function" ? q[k](A) : q[k];
  const opts = q => val(q, "options") || [];
  const money = n => "$" + Math.round(n).toLocaleString("en-CA");
  const strip = s => String(s == null ? "" : s).replace(/<[^>]*>/g, "");
  const $ = s => document.querySelector(s);

  /* Sliders start where the current calculator starts them; the other answers
     start at our guess, marked as a guess until the visitor changes it. Two of
     the guesses are the answers the calculator itself calls the most common. */
  const A = { quotes: 10, hoursEach: 1.5, rate: 40, priceSrc: "head", intake: "mixed",
    scope: "some", turnaround: "d2", lost: "dunno", jobValue: 5000 };
  A.tasks = opts(byId("tasks")).map(o => o.value);
  const yours = new Set();          // our guesses the visitor has changed
  const moved = new Set();          // sliders the visitor has moved
  const est = new Set();            // sliders started at our estimate for this company
  /* this tab's answers so far, so a reload or a trip to the home page and back
     picks up where they left off (one memory per company code, like the visit) */
  const MEMO = "fourtaps_quote_" + (function () {
    try { return (new URLSearchParams(location.search).get("lead") || "").slice(0, 40); } catch (e) { return ""; }
  })();
  try {
    const m = JSON.parse(sessionStorage.getItem(MEMO) || "null");
    if (m && m.A) { Object.assign(A, m.A); (m.yours || []).forEach(id => yours.add(id)); (m.moved || []).forEach(id => moved.add(id)); }
  } catch (e) { /* storage blocked */ }
  /* the three answers from the home page's sliders, when the visitor came from there */
  (function () {
    let p; try { p = new URLSearchParams(location.search); } catch (e) { return; }
    [["quotes", "q"], ["hoursEach", "h"]].forEach(([id, k]) => {
      const s = byId(id).slider, v = parseFloat(p.get(k));
      if (v >= s.min && v <= s.max) { A[id] = v; moved.add(id); }
    });
    const r = parseFloat(p.get("r"));
    if (r >= 20 && r <= 200) { A.rate = Math.round(r); moved.add("rate"); }
  })();
  const WHY = { priceSrc: "the most common answer", lost: "the most common answer" };
  const FINE = ["priceSrc", "tasks", "intake", "scope"], LOCK = ["turnaround", "lost", "jobValue"];
  const LABEL = { priceSrc: "Where your prices come from", tasks: "Tasks on every quote", intake: "How requests arrive",
    scope: "What else that person does", turnaround: "How long customers wait", lost: "Work lost to late quotes",
    jobValue: "Average job value" };
  const who = byId("who");
  /* The hour slider bends between fixed points so the three people under it sit
     evenly spaced, each under its own rate: $20 at the start, $32 a sixth of the
     way, $40 halfway, $90 five sixths of the way, $200 at the end. */
  const BENDS = [[0, 20], [1000 / 6, 32], [500, 40], [5000 / 6, 90], [1000, 200]];
  const along = (x, from, to) => {
    for (let i = 1; i < BENDS.length; i++) {
      const [p0, r0] = [BENDS[i - 1][from], BENDS[i - 1][to]], [p1, r1] = [BENDS[i][from], BENDS[i][to]];
      if (x <= p1 || i === BENDS.length - 1) return r0 + (r1 - r0) * (x - p0) / (p1 - p0);
    }
  };
  const toRate = p => Math.round(along(p, 0, 1));
  const toPos = r => along(r, 1, 0);
  /* Who quotes, as stops at their usual rates. Sales staff ($38) and whoever is
     free ($40) are one stop: two dollars apart, they would sit on top of each other. */
  const STOPS = [
    { who: "estimator", label: "Estimator", rate: who.sets("estimator").rate },
    { who: "shared", label: "Sales / shared", rate: who.sets("shared").rate },
    { who: "owner", label: "Me (owner)", rate: who.sets("owner").rate } ];

  const slider = id => {
    const q = byId(id), s = q.slider;
    return `<div class="ctl"><div class="ctl-top"><label for="s-${id}">${strip(val(q, "ask"))}</label><output id="o-${id}" for="s-${id}"></output></div>
      <p class="ctl-note" id="n-${id}"></p>
      <input type="range" id="s-${id}" min="${s.min}" max="${s.max}" step="${s.step}"></div>`;
  };
  const row = id => {
    const q = byId(id), multi = q.type === "multi";
    return `<div class="row" id="r-${id}">
      <button type="button" class="row-head" aria-expanded="false" aria-controls="b-${id}">
        <span class="row-q">${LABEL[id]}</span>
        <span class="row-a"><span class="tag"></span><span class="txt"></span></span>
        <span class="row-edit">Change</span>
      </button>
      <div class="row-body" id="b-${id}" hidden>
        <div class="chips${multi ? " multi" : ""}" role="group" aria-label="${strip(val(q, "ask"))}">${opts(q).map(o =>
          `<button type="button" class="chip" data-v="${o.value}" aria-pressed="false">${o.chip || o.label}</button>`).join("")}</div>
        ${multi ? `<button type="button" class="btn small done">Done</button>` : ""}
      </div>
    </div>`;
  };

  $("#app").innerHTML = `
    <h1>${W.intro.title}</h1>
    <p class="dek">${W.intro.dek}</p>
    <div class="mbar" aria-hidden="true"><b id="myear"></b><span>a year</span><em id="mmo"></em></div>
    <section class="stepx" id="wk" aria-labelledby="h1s">
      <header class="stepx-h"><b aria-hidden="true">1</b><div><h2 id="h1s">Your week</h2><p>Three sliders. The number moves as you go.</p></div></header>
      <div class="stepx-body">
        <div class="stepx-q">
          ${slider("quotes")}
          ${slider("hoursEach")}
          <div class="ctl">
            <div class="ctl-top"><label for="s-rate">${strip(val(byId("rate"), "ask"))}</label><output id="o-rate" for="s-rate"></output></div>
            <input type="range" id="s-rate" min="0" max="1000" step="1">
            <div class="stops" id="stops" role="group" aria-label="Who puts the quotes together">${STOPS.map(s =>
              `<div class="stop" style="--f:${toPos(s.rate) / 1000}"><button type="button" data-who="${s.who}" aria-pressed="false"><span>${s.label}</span><small>$${s.rate}/hr</small></button></div>`).join("")}</div>
          </div>
        </div>
        <div class="stepx-r">
          <div class="card">
            <div class="year" id="year"></div><div class="lab" id="ylab"></div>
            <div class="pair">
              <div><b id="hw"></b><div class="lab" id="hl"></div></div>
              <div><b id="mo"></b><div class="lab" id="ml"></div></div>
            </div>
          </div>
          ${W.trust ? `<ul class="trust">${W.trust.map(t => `<li><span>${t}</span></li>`).join("")}</ul>` : ""}
        </div>
      </div>
    </section>
    <section class="stepx" aria-labelledby="h2s">
      <header class="stepx-h"><b aria-hidden="true">2</b><div><h2 id="h2s">Our guesses</h2><p>We filled these in for you. Change any that are wrong.</p></div></header>
      <div class="stepx-body">
        <div class="stepx-q"><div class="rows">${FINE.map(row).join("")}</div></div>
        <div class="stepx-r">
          <div class="box"><p class="now"><b id="y2"></b>a year, with your answers</p><h3>Where the hours go</h3><div id="bars"></div></div>
          <div class="flags" id="flags2"></div>
        </div>
      </div>
    </section>
    <section class="stepx" aria-labelledby="h3s">
      <header class="stepx-h"><b aria-hidden="true">3</b><div><h2 id="h3s">Unlock: work lost to slow quotes</h2><p>Answer these three and we show what late quotes cost you in jobs.</p></div></header>
      <div class="stepx-body">
        <div class="stepx-q"><div class="rows unlock">${LOCK.map(row).join("")}</div></div>
        <div class="stepx-r">
          <div class="card lock" id="lock">
            <div class="lock-h">Work lost to slow quotes</div>
            <div class="lock-v" id="lockv"></div>
            <div class="lock-n" id="lockn"></div>
            <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
          </div>
          <div class="flags" id="flags3"></div>
        </div>
      </div>
    </section>
    <section class="stepx stepx-end" aria-label="Your written result">
      <div class="cta">
        <button type="button" class="btn" id="send">Email me this, with the working</button>
        <a class="btn alt" data-book href="../book/">Book a free call</a>
      </div>
      <form class="mail" id="mail" hidden novalidate>
        <p class="mail-h">Where should it go?</p>
        <input id="m-business" type="text" placeholder="Business name" autocomplete="organization" aria-label="Business name">
        <input id="m-contact" type="text" placeholder="Your name" autocomplete="name" aria-label="Your name">
        <input id="m-email" type="email" placeholder="Email" autocomplete="email" inputmode="email" aria-label="Email" required>
        <input id="m-phone" type="tel" placeholder="Phone (optional)" autocomplete="tel" inputmode="tel" aria-label="Phone (optional)">
        <input id="m-website" class="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="mail-err" id="m-err" role="alert" hidden></p>
        <button type="submit" class="btn" id="m-send">Send it</button>
        <p class="fine">The numbers with the working shown, and the two things worth checking before anyone spends money. No newsletter.</p>
      </form>
      <div class="sent" id="sent" role="status" hidden><b>Got it.</b>Mostafa from fourtaps will send your written result, usually within one working day. We read every one of these ourselves.</div>
      <p class="fine">What you set here goes to fourtaps as you change it, so we can talk it through with you. Your name and email go only if you ask for the written result.</p>
    </section>`;

  /* warnings only from what the visitor told us, never from our guesses */
  function flagsFor(only) {
    const mine = { quotes: A.quotes, hoursEach: A.hoursEach, rate: A.rate, who: A.who, tasks: A.tasks };
    yours.forEach(id => { if (!only || only.includes(id)) mine[id] = A[id]; });
    return W.compute(mine).flags;
  }

  /* ---------- saving ---------- */
  /* One row per visit in fourtaps' database, copied to the Sheet (web/api/
     results.js). A visit lasts as long as the browser tab, so a reload replaces
     the same row; a different company code is a different visit. Nothing goes
     before the visitor changes something; then what they set is saved a moment
     after they stop, and when the page is hidden or closed. Stage "first" until
     the lost-jobs figure is unlocked, "result" once it is, and "contact" from
     the moment they ask for the written result. */
  const SHEET = W.sheet;
  const LEAD = (function () {
    try { return (new URLSearchParams(location.search).get("lead") || "").slice(0, 40); } catch (e) { return ""; }
  })();
  const VISIT = (function () {
    const KEY = "wedge_visit_" + W.wedge + "_" + LEAD;
    let v = null;
    try { v = sessionStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
    if (!v) {
      v = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { sessionStorage.setItem(KEY, v); } catch (e) { /* storage blocked */ }
    }
    return v;
  })();
  const SRC = (function () {
    const KEY = "wedge_src";
    let stored = null;
    try { stored = sessionStorage.getItem(KEY); } catch (e) { /* storage blocked */ }

    const qs = location.search.replace(/^\?/, "").slice(0, 300);
    let src = qs;
    if (!src) {
      try {
        const h = document.referrer ? new URL(document.referrer).hostname : "";
        if (h && h !== location.hostname) src = "ref=" + h;
      } catch (e) { /* opaque or malformed referrer */ }
    }
    /* A fresh query string wins; otherwise keep whatever the first visit recorded. */
    if (!qs && stored) return stored;
    if (src) { try { sessionStorage.setItem(KEY, src); } catch (e) { /* ignore */ } }
    return src;
  })();
  const unlocked = () => LOCK.every(id => yours.has(id));
  const touched = () => moved.size > 0 || yours.size > 0 || !!A.who;
  /* every answer in the Answers cell, saying which were left as they started */
  function answersText() {
    const ask = id => strip(val(byId(id), "ask"));
    const label = (q, x) => { const o = opts(q).find(o => String(o.value) === String(x)); return o ? strip(o.label) : String(x); };
    const left = id => moved.has(id) ? "" : est.has(id) ? " (our estimate)" : " (not changed)";
    const lines = ["quotes", "hoursEach"].map(id => ask(id) + " " + byId(id).slider.show(A[id]) + left(id));
    if (A.who) lines.push(ask("who") + " " + label(who, A.who));
    lines.push(ask("rate") + " $" + A.rate + " an hour" + (A.who ? "" : left("rate")));
    FINE.concat(LOCK).forEach(id => {
      const q = byId(id), v = A[id];
      lines.push(ask(id) + " " + (Array.isArray(v) ? v.map(x => label(q, x)).join(", ") : label(q, v)) + (yours.has(id) ? "" : " (our guess)"));
    });
    if (SRC) lines.push("Came from: " + SRC);
    return lines.join("\n");
  }
  function payload(stage, who) {
    const r = W.compute(A);
    return JSON.stringify(Object.assign({ visit: VISIT, stage, calculator: "Quoting", lead: LEAD, src: SRC,
      hours: r.freed, monthly: r.monthly, annual: r.annual, total: r.total, residual: r.residual,
      extra: unlocked() && r.extra ? strip(r.extra.value) : "",
      flags: flagsFor().map(f => strip(f.title)).join(" | "), answers: answersText() }, who || {}));
  }
  /* saves go one after another, so the newest answers are the ones that stay */
  let queue = Promise.resolve(), contacted = false, sentKey = "", wait = 0;
  function send(body) {
    const go = () => fetch(SHEET, { method: "POST", body, keepalive: true })
      .then(res => { if (!res.ok) throw new Error("not saved"); return res; });
    const sent = queue.then(go, go);
    queue = sent.catch(() => {});
    return sent;
  }
  function save(leaving) {
    clearTimeout(wait);
    if (!SHEET || !touched()) return;
    const stage = contacted ? "contact" : unlocked() ? "result" : "first";
    const key = stage + "|" + answersText();
    if (key === sentKey) return;                 // nothing new since the last save
    sentKey = key;
    const body = payload(stage);
    if (leaving && navigator.sendBeacon && navigator.sendBeacon(SHEET, body)) return;
    send(body).catch(() => {});
  }
  const saveSoon = () => { clearTimeout(wait); wait = setTimeout(() => save(false), 1200); };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(true); });
  window.addEventListener("pagehide", () => save(true));

  /* ---------- drawing what changed ---------- */
  let shown = null, fitCard = () => {};
  function update() {
    const r = W.compute(A);
    if (shown !== null && Math.round(r.annual) !== shown) { const y = $("#year"); y.classList.remove("bump"); void y.offsetWidth; y.classList.add("bump"); }
    shown = Math.round(r.annual);
    $("#year").textContent = $("#myear").textContent = money(r.annual);
    $("#ylab").textContent = r.labels.annual;
    $("#hw").innerHTML = r.freed.toFixed(1) + "<small>h/wk</small>"; $("#hl").textContent = r.labels.hours;
    $("#mo").innerHTML = money(r.monthly) + "<small>/month</small>"; $("#ml").textContent = r.labels.monthly;
    $("#mmo").textContent = money(r.monthly) + "/month";

    const got = LOCK.filter(id => yours.has(id)).length, open = got === LOCK.length && r.extra;
    $("#lock").classList.toggle("open", !!open);
    $("#lockv").textContent = open ? r.extra.value : "Answer 3 questions to see it";
    $("#lockn").innerHTML = open ? r.extra.note : got ? got + " of 3 answered, under “Unlock”." : "They are under “Unlock”.";
    document.querySelectorAll("#lock .dots i").forEach((d, i) => d.classList.toggle("on", i < got));

    const max = Math.max.apply(null, r.bars.map(b => b.hours).concat([0.001]));
    $("#bars").innerHTML = r.bars.map(b => `<div class="bar"><span>${b.label}</span><span class="track"><i style="width:${Math.max(2, b.hours / max * 100)}%"></i></span><span>${b.hours.toFixed(1)} h</span></div>`).join("");

    /* each step's warnings come from that step's answers */
    const flagHTML = only => flagsFor(only).map(f => `<div class="flag"><b>${f.title}</b>${f.body}</div>`).join("");
    $("#flags2").innerHTML = flagHTML(FINE);
    $("#flags3").innerHTML = flagHTML(LOCK);
    $("#y2").textContent = money(r.annual);

    ["quotes", "hoursEach"].forEach(id => {
      const s = byId(id).slider, el = $("#s-" + id), v = Math.min(s.max, Math.max(s.min, A[id]));
      if (+el.value !== v) el.value = v;
      el.style.setProperty("--p", ((v - s.min) / (s.max - s.min) * 100) + "%");
      $("#o-" + id).textContent = s.show(v);
      $("#n-" + id).textContent = typeof s.note === "function" ? s.note(A) : "";
    });
    const rp = Math.round(toPos(Math.min(200, Math.max(20, A.rate)))), rate = $("#s-rate");
    if (toRate(+rate.value) !== A.rate) rate.value = rp;
    rate.style.setProperty("--p", (+rate.value / 10) + "%");
    $("#o-rate").textContent = "$" + A.rate + " an hour";
    rate.setAttribute("aria-valuetext", "$" + A.rate + " an hour");
    document.querySelectorAll("#stops .stop").forEach(st => {
      const on = A.who === st.querySelector("button").dataset.who;
      st.classList.toggle("on", on); st.querySelector("button").setAttribute("aria-pressed", on);
    });
    FINE.concat(LOCK).forEach(id => {
      const q = byId(id), el = $("#r-" + id), mineToo = yours.has(id);
      el.classList.toggle("yours", mineToo);
      el.querySelector(".tag").textContent = mineToo ? "Yours" : "Our guess";
      let txt;
      if (q.type === "multi") { const n = A[id].length, t = opts(q).length; txt = n === t ? "All " + t + " tasks" : n + " of " + t + " tasks"; }
      else { const o = opts(q).find(o => String(o.value) === String(A[id])); txt = o ? strip(o.chip || o.label) : ""; }
      el.querySelector(".txt").innerHTML = txt + (!mineToo && WHY[id] ? ` <span class="why">· ${WHY[id]}</span>` : "");
      const picked = (Array.isArray(A[id]) ? A[id] : [A[id]]).map(String);
      el.querySelectorAll(".chip").forEach(b => { const on = picked.includes(b.dataset.v); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    });
    fitCard();
    saveSoon();
    /* left for the home page, so going back to it shows this visitor their own
       figure: the sliders they moved and the share their answers give */
    if (touched()) try {
      const m = { s: r.total > 0 ? r.freed / r.total : 0 };
      if (moved.has("quotes")) m.q = A.quotes;
      if (moved.has("hoursEach")) m.h = A.hoursEach;
      if (moved.has("rate") || A.who) m.r = A.rate;
      sessionStorage.setItem("fourtaps_calc", JSON.stringify(m));
      sessionStorage.setItem(MEMO, JSON.stringify({ A, yours: [...yours], moved: [...moved] }));
    } catch (e) { /* storage blocked */ }
  }

  /* ---------- what the visitor does ---------- */
  ["quotes", "hoursEach"].forEach(id => $("#s-" + id).addEventListener("input", e => { A[id] = +e.target.value; moved.add(id); update(); }));
  /* sliding sets the rate only; who quotes is whichever stop they last tapped */
  $("#s-rate").addEventListener("input", e => { A.rate = toRate(+e.target.value); moved.add("rate"); update(); });
  document.querySelectorAll("#stops button").forEach(b => b.addEventListener("click", () => {
    const st = STOPS.find(s => s.who === b.dataset.who); A.who = st.who; A.rate = st.rate; update();
  }));
  const close = el => { el.classList.remove("open"); el.querySelector(".row-head").setAttribute("aria-expanded", "false"); el.querySelector(".row-body").hidden = true; };
  FINE.concat(LOCK).forEach(id => {
    const q = byId(id), el = $("#r-" + id);
    el.querySelector(".row-head").addEventListener("click", () => {
      const opening = !el.classList.contains("open");
      document.querySelectorAll(".row.open").forEach(close);     // one open at a time
      if (opening) { el.classList.add("open"); el.querySelector(".row-head").setAttribute("aria-expanded", "true"); el.querySelector(".row-body").hidden = false; }
    });
    el.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      const o = opts(q).find(o => String(o.value) === b.dataset.v);
      if (q.type === "multi") {
        const next = A[id].includes(o.value) ? A[id].filter(x => x !== o.value) : A[id].concat([o.value]);
        if (!next.length) return;                                  // the last tick stays
        A[id] = next;
      } else { A[id] = o.value; close(el); }
      yours.add(id); update();
    }));
    const done = el.querySelector(".done");
    if (done) done.addEventListener("click", () => { yours.add(id); close(el); update(); });
  });
  /* On a wide page the card reaches down to the foot of the three people under
     the hour slider, so "Your week" and the card line up top and bottom while
     the page is at rest. Measured again whenever anything could have moved. */
  const wk = $("#wk"), card = $(".card"), wide = window.matchMedia("(min-width: 861px)");
  fitCard = () => {
    if (!wide.matches) { card.style.minHeight = ""; return; }
    const foot = Math.max.apply(null, [...document.querySelectorAll("#stops button")].map(b => b.getBoundingClientRect().bottom));
    card.style.minHeight = (foot - card.getBoundingClientRect().top) + "px";
  };
  if ("ResizeObserver" in window) new ResizeObserver(fitCard).observe(wk);
  window.addEventListener("resize", fitCard);
  if (document.fonts) document.fonts.ready.then(fitCard);
  fitCard();
  /* A company's own page: with its lead code in the link, its name in the title,
     our estimates from its job ad as the starting sliders (any the visitor has not
     set themselves) and a line saying so, from the Sheet's "Site" columns through
     web/api/lead.js. Without a code, or with no Site words, nothing changes. */
  if (/^[a-hjkmnp-z][a-hjkmnp-z2-9]{7}$/.test(LEAD.toLowerCase())) {
    fetch("/api/lead?code=" + LEAD.toLowerCase()).then(r => r.ok ? r.json() : null).then(L => {
      if (!L || !L.ok) return;
      if (L.name) document.querySelector("#app h1").textContent = "What do slow quotes cost " + L.name + "?";
      [["quotes", "q"], ["hoursEach", "h"], ["rate", "r"]].forEach(([id, k]) => {
        if (L[k] == null || moved.has(id) || (id === "rate" && A.who)) return;
        A[id] = L[k]; est.add(id);
      });
      if (est.size) document.querySelector("#wk .stepx-h p").textContent = "Our estimate from your job ad. Move the sliders to match your week.";
      update();
    }).catch(() => {});
  }
  /* the written result: the form opens in place, and sends on the same row */
  $("#send").addEventListener("click", () => { $("#send").hidden = true; $("#mail").hidden = false; $("#m-email").focus(); });
  $("#mail").addEventListener("submit", e => {
    e.preventDefault();
    const email = $("#m-email").value.trim(), err = $("#m-err"), btn = $("#m-send");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      err.textContent = "Please give an email we can send it to."; err.hidden = false; $("#m-email").focus(); return;
    }
    err.hidden = true; btn.disabled = true; btn.textContent = "Sending…"; clearTimeout(wait);
    send(payload("contact", { business: $("#m-business").value.trim(), contact: $("#m-contact").value.trim(),
      email, phone: $("#m-phone").value.trim(), website: $("#m-website").value }))
      .then(() => { contacted = true; sentKey = "contact|" + answersText(); $("#mail").hidden = true; $("#sent").hidden = false; })
      .catch(() => { btn.disabled = false; btn.textContent = "Send it"; err.textContent = "That didn't send. Check your connection and try again."; err.hidden = false; });
  });
  /* the ways out keep the company code the visitor arrived with */
  if (location.search) {
    document.querySelectorAll("a[data-home]").forEach(a => { a.href = "../" + location.search; });
    document.querySelectorAll("a[data-book]").forEach(a => { a.href = "../book/" + location.search; });
  }
  update();
})();
</script>
</body>
</html>
