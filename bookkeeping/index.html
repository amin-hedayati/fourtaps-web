<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5FA">
<title>What do the books cost you?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F3F5FA; --card:#FFFFFF; --ink:#0A0F2C; --muted:#4B5270;
  --rule:#DDE1EC; --rule2:#C3C9DC;
  --acc:#2A3BF5; --acc-soft:#E7EAFE; --acc-ink:#FFFFFF;
  --lime:#D7FF3F; --night:#0A0F2C;
  --warn:#8A5300; --warn-soft:#FFF1D6;
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --sans:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --maxw:640px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);overflow-x:hidden;
  font:400 17px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased}
.wrap{position:relative;max-width:none;margin:0;padding:0}
#app,footer{position:relative;z-index:1}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(10,15,44,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(10,15,44,.06) 1px,transparent 1px);
  background-size:56px 56px;background-position:center top;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 20%,#000 10%,transparent 75%);
  mask-image:radial-gradient(ellipse 70% 60% at 50% 20%,#000 10%,transparent 75%)}

/* ---- the bar at the top ---- */
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
  height:calc(72px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 24px 0}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
.brand-name{font:700 22px/1 var(--display);letter-spacing:-.025em}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;grid-template-columns:repeat(2,auto);place-content:center;gap:4px;flex-shrink:0}
.pill{width:7px;height:7px;border-radius:50%;background:#FFFFFF}
.pill.lime{background:var(--lime)}
.home{display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:15px;color:var(--muted);text-decoration:none}
.home:hover{color:var(--acc)}
.brand:focus-visible,.home:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:6px}

/* ---- one screen at a time, Typeform-style -------------------------------- */
.screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;
  padding:104px 24px 84px}
.screen.tall{align-items:flex-start;padding-top:112px}     /* result & contact scroll */
.frame{width:100%;max-width:var(--maxw);margin:0 auto;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;letter-spacing:-.025em;text-wrap:balance}

/* number pill above the question, the Typeform tell */
.qnum{display:inline-flex;align-items:center;gap:8px;color:var(--acc);
  font:700 15px/1 "Public Sans",sans-serif;margin-bottom:16px}
.qnum .arw{font-size:15px;transform:translateY(.5px)}

.q{font-family:var(--display);font-weight:700;letter-spacing:-.025em;
  font-size:clamp(24px,4.6vw,34px);line-height:1.18;margin:0 0 8px;text-wrap:balance}
.note{color:var(--muted);font-size:16px;margin:8px 0 0;line-height:1.5}
.note b{color:var(--ink)}

/* choices */
.opts{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;text-align:left;cursor:pointer;
  background:var(--card);border:1.5px solid var(--rule);
  border-radius:16px;padding:12px 16px;font:500 17px/1.35 var(--sans);color:var(--ink);
  transition:background .2s,border-color .2s,transform .2s cubic-bezier(.2,.8,.2,1)}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.99)}
.opt.on{background:var(--acc-soft);border-color:var(--acc)}
.opt:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.opt .key{flex:0 0 auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font:700 14px/1 var(--display);color:var(--ink);
  border:1.5px solid var(--rule);
  background:var(--paper);transition:background .2s,color .2s,border-color .2s}
.opt.on .key{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.opt .lbl{flex:1;min-width:0}
.opt .lbl small{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:3px}
.opt .ck{flex:0 0 auto;width:18px;opacity:0;color:var(--acc);font-weight:700;transition:opacity .2s}
.opt.on .ck{opacity:1}

/* text / number field */
.field{margin-top:26px}
input[type=number],input[type=text],input[type=email],input[type=tel]{
  width:100%;background:var(--card);color:var(--ink);
  border:1.5px solid var(--rule);
  border-radius:14px;padding:14px 16px;font:600 clamp(18px,3vw,22px)/1.3 var(--sans);
  transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}

/* controls row: OK + keyboard hint */
.controls{display:flex;align-items:center;gap:16px;margin-top:30px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;background:var(--acc);color:var(--acc-ink);
  border:none;border-radius:14px;padding:12px 24px;font:700 16px/1.25 var(--sans);text-align:left;cursor:pointer;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.btn:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 0 var(--ink)}
.btn:active{transform:none;box-shadow:none}
.btn:focus-visible,.lnk:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.btn[disabled]{opacity:.4;cursor:default;transform:none;box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule2)}
.btn.alt:hover{box-shadow:inset 0 0 0 1.5px var(--ink),5px 5px 0 0 var(--ink)}
.btn .en{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;
  background:rgba(255,255,255,.2);font:700 12px/1 "Public Sans",sans-serif}
.hint{color:var(--muted);font-size:14px}
.hint kbd{font:700 12px/1 "Public Sans",sans-serif;background:var(--card);border:1px solid var(--rule2);
  border-bottom-width:2px;border-radius:6px;padding:3px 7px;color:var(--ink)}
.lnk{background:none;border:none;border-radius:8px;color:var(--muted);font:600 15px var(--sans);cursor:pointer;
  min-height:44px;padding:8px 4px}
.lnk:hover{color:var(--acc)}

/* fixed progress bar, pinned to the very bottom */
.tfprog{position:fixed;left:0;bottom:0;width:100%;height:6px;background:var(--rule);z-index:30}
.tfprog i{display:block;height:100%;width:0;background:var(--acc);border-radius:0 6px 6px 0;
  transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---- the number so far, on the question screens ---- */
.sofar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:25;
  display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap;padding:12px 20px;border-radius:999px;
  background:var(--night);color:rgba(255,255,255,.75);font:600 14px/1 var(--sans);
  box-shadow:0 18px 40px -16px rgba(10,15,44,.55);animation:riseX .5s cubic-bezier(.2,.8,.2,1) both}
.sofar b{font:700 21px/1 var(--display);letter-spacing:-.02em;color:var(--lime);font-variant-numeric:tabular-nums}
.sofar.wait{background:var(--card);color:var(--muted);border:1px solid var(--rule);box-shadow:none;animation:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes riseX{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translateX(-50%)}}

/* ---- intro (welcome screen) ---- */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:700 13px/1.3 "Public Sans",sans-serif;
  letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:20px}
.eyebrow::before{content:"";flex:0 0 auto;width:22px;height:2px;background:currentColor;border-radius:2px}
.intro h1{font-size:clamp(36px,8vw,60px);line-height:1.02;letter-spacing:-.02em;margin:0}
.intro .dek{font-size:19px;color:var(--muted);margin:20px 0 0;line-height:1.55}
.intro .dek b{color:var(--ink);font-weight:600}
.intro .controls{margin-top:32px}
.fine{font-size:13px;color:var(--muted);margin:22px 0 0;line-height:1.55;max-width:52ch}

/* ---- part one: its questions on one screen, the figures changing live ---- */
.screen.wide{padding-top:88px}
.screen.wide .frame{max-width:1060px}
.screen.wide .eyebrow{margin-bottom:10px}
.live-h{font-size:clamp(28px,4.2vw,40px);line-height:1.08;letter-spacing:-.02em;margin:0}
.live-dek{font-size:16px;color:var(--muted);margin:8px 0 0;line-height:1.5;max-width:72ch}
.live-dek b{color:var(--ink);font-weight:600}
.live{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"in side";
  column-gap:48px;row-gap:20px;align-items:start;margin-top:24px}
.live-in{grid-area:in}
/* the figures and the way on stay together beside a long column of questions */
.live-side{grid-area:side;position:sticky;top:24px;display:flex;flex-direction:column;gap:20px}
.live-out{background:var(--night);color:#FFFFFF;border-radius:24px;padding:26px 26px 22px}
.live-go .note{margin:0;font-size:14.5px}
.live-go .controls{margin-top:14px}
.ly{font:700 clamp(44px,6vw,64px)/1 var(--display);letter-spacing:-.02em;color:var(--lime);font-variant-numeric:tabular-nums}
.lab{font-size:13.5px;line-height:1.4;color:rgba(255,255,255,.75);margin-top:6px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
.pair b{font:700 24px/1 var(--display);letter-spacing:-.02em;color:#FFFFFF;font-variant-numeric:tabular-nums}
.pair b small{font:600 13px/1 var(--sans);letter-spacing:0;color:rgba(255,255,255,.6);margin-left:4px}
/* close to the top, the card snaps up and stretches to the full width, its
   corners flattening and the rest of its look unchanged; on the way back down
   it settles into its place again */
.live-out.moving{transition:top .35s cubic-bezier(.2,.8,.2,1),left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),
  border-radius .35s,box-shadow .35s}
.live-out.docked{position:fixed;z-index:40;margin:0;border-radius:0;box-shadow:0 14px 34px -18px rgba(10,15,44,.7)}
.lq{padding:18px 0;border-top:1px solid var(--rule)}
.lq:first-child{border-top:0;padding-top:4px}
.lq-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.lq-top label,.lq-top .lk{font:600 16.5px/1.35 var(--sans);color:var(--ink)}
.lq-top output{font:700 19px/1.2 var(--display);letter-spacing:-.01em;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.lnote{font-size:13.5px;color:var(--muted);margin:4px 0 0;line-height:1.45}
.lnote:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{min-height:44px;padding:9px 16px;border-radius:999px;border:1.5px solid var(--rule2);background:var(--card);
  color:var(--ink);font:600 15px/1.25 var(--sans);cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* a tick-list: several can be on, so a ticked one is lighter than a picked answer */
.chips.multi .chip.on{background:var(--acc-soft);color:var(--ink);border-color:var(--acc)}
.chips.multi .chip.on::before{content:"✓";color:var(--acc);font-weight:700;margin-right:6px}
.lhint{margin:10px 0 0;font-size:14px;line-height:1.45;font-weight:600;color:var(--acc)}
/* the optional questions, grouped under the main ones and closed until asked for */
.lx{margin-top:22px;padding:0 20px;border:1.5px solid var(--rule);border-radius:20px;background:var(--card)}
.lx-open{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:44px;padding:16px 0;
  background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.lx-open:focus-visible{outline:3px solid var(--acc);outline-offset:4px;border-radius:12px}
.lx-open:hover .lx-h{color:var(--acc)}
.lx-h{display:block;font:700 17px/1.3 var(--display);letter-spacing:-.01em;color:var(--ink);transition:color .2s}
.lx-n{display:block;font-size:14px;line-height:1.45;color:var(--muted);margin-top:4px}
.lx-plus{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acc);
  color:var(--acc-ink);font:600 22px/1 var(--sans);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.lx-open[aria-expanded="true"] .lx-plus{transform:rotate(45deg)}
.lx-q{padding-bottom:4px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.lx-q .lq:first-child{border-top:1px solid var(--rule);padding-top:18px}
.lhint:empty{display:none}
/* what they can check for themselves: where the sums come from, the tools, no sign-up */
.trust{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.trust li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;font-size:14px;line-height:1.5;color:var(--muted)}
.trust li::before{content:"✓";color:var(--acc);font-weight:700}
.trust b{color:var(--ink);font-weight:600}
.nosign{margin:12px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.lq input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:32px;margin:8px 0 0;padding:0;
  background:transparent;border:0;box-shadow:none;cursor:pointer}
.lq input[type=range]:focus{outline:none;box-shadow:none}
.lq input[type=range]:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:8px}
.lq input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;
  background:linear-gradient(to right,var(--acc) var(--p,50%),var(--rule) var(--p,50%))}
.lq input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;margin-top:-10px;
  border-radius:50%;background:#FFFFFF;border:3px solid var(--acc);box-shadow:0 2px 8px rgba(10,15,44,.22)}
.lq input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--rule)}
.lq input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--acc)}
.lq input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#FFFFFF;border:3px solid var(--acc)}
@media(max-width:860px){
  .screen.wide{padding-top:80px}
  .live{grid-template-columns:minmax(0,1fr);grid-template-areas:"out" "in" "go";margin-top:16px;row-gap:14px}
  .live-side{display:contents}
  .live-slot{grid-area:out}
  .live-out{padding:16px 20px}
  .live-go{grid-area:go}
  .ly{font-size:40px}
  .pair{margin-top:12px;padding-top:12px}
  .pair b{font-size:20px}
  .pair .lab{display:none}
}

/* ---- result ---- */
.big{font-family:var(--display);font-weight:700;font-size:clamp(46px,12vw,84px);
  line-height:1;color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:.36em;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:3px}
.rlabel{color:var(--muted);font-size:16px;margin-top:8px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:24px 0 4px;align-items:start;
  background:var(--night);color:#FFFFFF;border-radius:24px;padding:28px 24px}
.three .big{font-size:clamp(26px,5.2vw,36px);color:var(--lime)}
.three .big small{color:rgba(255,255,255,.6)}
.three .rlabel{font-size:13.5px;line-height:1.4;margin-top:6px;color:rgba(255,255,255,.75)}
@media(max-width:560px){.three{grid-template-columns:1fr;gap:20px;text-align:left}
  .three .big{font-size:40px}}

h3.sec{font:700 13px/1 "Public Sans",sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin:32px 0 12px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:12px;align-items:center;font-size:14.5px}
.bar-row .bl{color:var(--ink)}
.bar-track{background:var(--acc-soft);border-radius:99px;height:12px;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--acc);border-radius:99px;
  animation:grow .7s cubic-bezier(.4,0,.2,1) both}
@keyframes grow{from{width:0!important}}
.bar-row .bh{font-weight:600;font-size:13.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:520px){.bar-row{grid-template-columns:1fr auto;gap:4px 10px}
  .bar-track{grid-column:1/3;order:3}}

.upside{margin-top:24px;padding:24px;border-radius:24px;background:var(--acc);color:#FFFFFF}
.upside .ul{font:700 13px/1 "Public Sans",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.upside .uv{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-size:clamp(28px,6vw,40px);line-height:1.1;margin-top:10px;color:#FFFFFF}
.upside .un{font-size:14.5px;color:rgba(255,255,255,.88);margin-top:8px;line-height:1.5}

.flag{margin-top:12px;padding:16px 18px;border-radius:16px;font-size:14.5px;line-height:1.55;
  background:var(--card);border:1px solid var(--rule)}
.flag b{display:block;margin-bottom:4px;font-size:15.5px}
.flag.warn{background:var(--warn-soft);border-color:transparent}
.caveat{background:var(--warn-soft);border-radius:16px;
  padding:16px 18px;margin-top:22px;font-size:14.5px;color:var(--ink);line-height:1.55}
textarea.caveat{display:block;border:0;font:var(--sans);font-size:14px;resize:vertical}

/* ---- contact ---- */
.fieldrow{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.done{text-align:center}
.done .big{width:88px;height:88px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  background:var(--lime);color:var(--ink);font-size:40px}
footer{max-width:var(--maxw);margin:40px auto 0;padding:0 24px calc(40px + env(safe-area-inset-bottom,0px));
  font-size:13px;color:var(--muted);line-height:1.65}
body[data-screen="q"] footer,body[data-screen="intro"] footer{display:none}

@media(max-width:520px){.screen{padding:96px 20px 76px}.screen.tall{padding-top:100px}.screen.wide{padding-top:76px}
  .top{padding-left:20px;padding-right:20px}.brand-name{font-size:21px}footer{padding-left:20px;padding-right:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="wrap">
<div class="gridbg" aria-hidden="true"></div>
<header class="top">
<a class="brand" data-home href="../" aria-label="fourtaps home"><span class="logo" aria-hidden="true"><span class="pill"></span><span class="pill"></span><span class="pill"></span><span class="pill lime"></span></span><span class="brand-name">fourtaps</span></a>
<a class="home" data-home href="../">← Home</a>
</header>

<div id="app"></div>
<footer>Task shares come from 1,105 Canadian businesses that advertised this seat in July and August 2026. What you set goes to fourtaps when you move on or leave the page; your name and email only if you give them.</footer>
</div>

</script>
<script>
window.WEDGE = (function () {
  var TASKS = {
    coding:    { label: "Entering & coding transactions", rem: .90, hint: "Reading a receipt and putting it in the right account" },
    invoicing: { label: "Invoicing & chasing receivables", rem: .85, hint: "Drafting, sending, matching payments, reminders" },
    ap:        { label: "Paying supplier bills (AP)",      rem: .85, hint: "Capturing bills and preparing the run" },
    recon:     { label: "Bank & card reconciliation",      rem: .80, hint: "Matching the feed, listing the exceptions" },
    payroll:   { label: "Running payroll",                 rem: .75, hint: "The run itself, remittances, records" },
    gst:       { label: "GST/HST filing prep",             rem: .70 },
    reports:   { label: "Month-end reports",               rem: .75, hint: "Written from books the system already keeps" },
    receipts:  { label: "Collecting & filing receipts",    rem: .60, hint: "Only automatable once they arrive digitally" }
  };
  var RATE = { fte: 26, pte: 30, owner: 75, external: 60, accountant: 120 };
  var RATE_HINT = {
    fte: "Median stated bookkeeper wage in Canadian postings is about $26/hr. Use your real all-in cost if you know it.",
    pte: "Part-time bookkeepers typically bill $25–35/hr.",
    owner: "Owners usually value their hour at what it earns elsewhere — $75+ is typical.",
    external: "External bookkeepers typically bill $50–70/hr.",
    accountant: "Accountant time on routine books commonly bills $100–150/hr."
  };
  return {
    endpoint: null,
    sheet: "/api/results",
    wedge: "W1",
    numberAfter: "hours",   // the answer that makes a dollar figure possible
    firstPart: 6,           // questions on the live screen
    more: "See where the hours go",   // what part two adds
    trust: [   // only what is true today; tools by name, never their logos
      "<b>Measured, not guessed:</b> job ads from 1,105 Canadian businesses hiring bookkeepers, July and August 2026.",
      "<b>Works with what you use:</b> QuickBooks Online, Xero, QuickBooks Desktop, Sage 50 and spreadsheets. Nothing to replace."
    ],
  intro: {
    eyebrow: "Live estimate",
    title: "What do the books cost you?",
    dek: "Most of a bookkeeping seat is <b>re-typing things that already arrived as files</b>. Set your week below and watch what it costs.",
    cta: "Start &rarr;",
    fine: "Three more taps after this show where the hours go. What you set here goes to fourtaps when you move on or leave the page, so we can talk it through with you. Your name and email go only if you ask for the written result."
  },
    questions: [
      { id: "who", type: "choice", ask: "Who does the books today?",
        sets: function (v) { return { rate: RATE[v] }; },
        options: [
          { value: "fte", label: "A full-time bookkeeper or admin", chip: "A full-time person" },
          { value: "pte", label: "Someone part-time" },
          { value: "owner", label: "Me, or a family member", chip: "Me or family", hint: "The most common answer under 20 staff" },
          { value: "external", label: "An outside bookkeeping firm", chip: "An outside firm" },
          { value: "accountant", label: "Our accountant does it all", chip: "Our accountant" } ] },
      { id: "people", type: "choice", numeric: true,
        slider: { min: 1, max: 10, step: 1, start: 1,
          show: function (v) { return v === 1 ? "1 person" : v + " people"; } },
        ask: "How many people touch the books each week?",
        note: "Anyone who codes a transaction, chases an invoice or runs payroll — including you.",
        options: [
          { value: 1, label: "Just one" },
          { value: 2, label: "Two" },
          { value: 3.5, label: "Three or four" },
          { value: 6, label: "Five or more" } ] },
      { id: "hours", type: "choice", numeric: true,
        slider: { min: 1, max: 40, step: 1, start: 8,
          show: function (v) { return v + (v === 1 ? " hour" : " hours"); } },
        ask: "How many hours a week does it take them — <i>each</i>?",
        note: "A rough band is fine. Most owners under-count this by about a third.",
        options: [
          { value: 3, label: "Under 5 hours" },
          { value: 7.5, label: "5 to 10 hours", hint: "About a day a week" },
          { value: 15, label: "10 to 20 hours" },
          { value: 27, label: "20 to 35 hours" },
          { value: 40, label: "It's a full-time job" } ] },
      { id: "rate", type: "choice", numeric: true,
        slider: { min: 15, max: 200, step: 1, start: 26,
          note: function (a) { return a.who ? RATE_HINT[a.who] : ""; },
          show: function (v) { return "$" + v + " an hour"; } },
        ask: "What is that hour worth?",
        note: function (a) { return RATE_HINT[a.who] || RATE_HINT.fte; },
        options: function (a) {
          var d = RATE[a.who] || 26;
          var bands = a.who === "owner"
            ? [[50, "$50 an hour"], [75, "$75 an hour", "typical for an owner"], [120, "$120 an hour"], [200, "$200 or more"]]
            : a.who === "accountant"
            ? [[90, "$90 an hour"], [120, "$120 an hour", "typical accountant rate"], [160, "$160 an hour"], [60, "Less than $90"]]
            : [[22, "About $22 an hour"], [d, "About $" + d + " an hour", "the market median for this"], [40, "About $40 an hour"], [60, "$60 or more"]];
          return bands.map(function (b) { return { value: b[0], label: b[1], hint: b[2] }; });
        } },
      { id: "intake", type: "choice", ask: "How do receipts and supplier bills arrive?",
        note: "This is the question that decides whether any of it works.",
        options: [
          { value: "digital", label: "Email or an app, almost all of it", chip: "Email or an app", hint: "The best case — it can be read straight in" },
          { value: "mixed", label: "A mix — some email, some paper", chip: "A mix of both", hint: "Half of it is already digital" },
          { value: "paper", label: "Mostly paper, in a folder or a shoebox", chip: "Mostly paper", hint: "The one real blocker — usually fixed first with a cheap app" } ] },
      { id: "software", type: "choice", ask: "What do the books run on?",
        options: [
          { value: "cloud", label: "QuickBooks Online or Xero", hint: "Connects directly — the easiest case" },
          { value: "desktop", label: "QuickBooks Desktop, Sage 50, Simply, Acomba", chip: "Desktop software", hint: "Works, but needs a bridge" },
          { value: "sheets", label: "Spreadsheets", hint: "More automatable than people expect" },
          { value: "unknown", label: "I genuinely don't know", chip: "I don't know", hint: "Fine — your bookkeeper does" } ] },
      { id: "tasks", type: "multi",
        ask: "Which of these happen every week?",
        note: "Untick anything that isn't your problem. The percentages behind them differ, so this changes the answer.",
        options: Object.keys(TASKS).map(function (k) {
          return { value: k, label: TASKS[k].label, hint: TASKS[k].hint }; }) },
      { id: "scope", type: "choice", ask: "Besides the books, what else does that person do?",
        note: "The honest answer here is worth more than any number above it.",
        options: [
          { value: "none", label: "Nothing — it's just the books" },
          { value: "some", label: "Some admin, invoicing, filing" },
          { value: "lots", label: "Reception, orders, operations — the books are one part of the job" } ] },
      { id: "staff", type: "choice", numeric: true,
        ask: "Roughly how many people are on payroll?",
        note: "Only used to sanity-check the payroll line. None is a perfectly good answer.",
        options: [
          { value: 0, label: "Nobody — no payroll" },
          { value: 3, label: "1 to 5" },
          { value: 12, label: "6 to 20" },
          { value: 35, label: "21 to 50" },
          { value: 80, label: "More than 50" } ] }
    ],
    compute: function (a) {
      var people = Math.max(1, Math.round(+a.people || 1));
      var total  = Math.max(0, (+a.hours || 0)) * people;
      var rate   = Math.max(1, +a.rate || 26);
      var mult   = { cloud: 1, desktop: .85, sheets: .8, unknown: .85 }[a.software] || .85;
      var intake = { digital: 1, mixed: .78, paper: .45 }[a.intake] || .78;
      var sel    = (a.tasks || []).filter(function (k) { return TASKS[k]; });
      if (!sel.length) sel = ["coding"];
      var per = total / sel.length, freed = 0, bars = [];
      sel.forEach(function (k) {
        // receipt collection is gated by intake specifically; the rest by the software surface
        var gate = (k === "receipts") ? intake : mult * (0.55 + 0.45 * intake);
        var h = per * TASKS[k].rem * gate;
        freed += h;
        bars.push({ label: TASKS[k].label, hours: h });
      });
      bars.sort(function (x, y) { return y.hours - x.hours; });
      var annual = freed * rate * 52, residual = Math.max(0, total - freed);
      var owner = a.who === "owner";
      var flags = [];
      if (a.scope === "lots") flags.push({ tone: "warn", title: "Heads up — this role is more than the books.",
        body: "Removing the bookkeeping will not remove the seat, because reception, orders and operations stay. What happens here is that the job shrinks, not that it disappears. Worth knowing before anyone quotes you." });
      else if (a.scope === "some") flags.push({ title: "Part of this role sits outside the books.",
        body: "The bookkeeping goes; the admin does not. Most businesses in this position move to a part-time person rather than removing the seat." });
      if (a.intake === "paper") flags.push({ tone: "warn", title: "Paper receipts are the one real blocker.",
        body: "Somebody has to turn paper into data, and that somebody is a person. We would fix intake first — usually a $20-a-month app — before automating anything, and we will say so rather than sell you something that cannot work yet." });
      else if (a.intake === "mixed") flags.push({ title: "Half your intake is already digital.",
        body: "The digital half automates today. The paper half is a small habit change, not a project." });
      if (a.software === "desktop") flags.push({ title: "Desktop accounting needs a bridge.",
        body: "Sage 50, Simply and QuickBooks Desktop have no proper API, so the connection is more brittle and costs more to keep running. Not a blocker, but it belongs in the quote." });
      var ptline = "";
      if (!owner && residual > 0 && residual <= 16)
        ptline = "That is usually a part-time person, or an hour a day from someone already on your team — not a full-time hire.";
      else if (owner && freed >= 6)
        ptline = "Those are your evenings, not a salary line.";
      return {
        freed: freed, monthly: annual / 12, annual: annual, total: total, residual: residual,
        bars: bars, flags: flags, ptline: ptline,
        labels: {
          hours:   owner ? "hours a week back in your hands" : "hours a week off that person's plate",
          monthly: owner ? "a month of capacity, at what your hour earns" : "a month, at your stated rate",
          annual:  owner ? "a year of earning capacity" : "a year"
        },
        extra: null,
        caveat: a.intake === "paper"
          ? "That the paper problem is fixable cheaply. The figures above are what becomes possible <i>after</i> receipts arrive digitally, not before — and we would rather tell you that than sell you something that cannot work yet."
          : "How long each of those tasks actually takes <i>you</i>. We measured which tasks this job contains across 1,105 businesses and how removable each one is — not how many hours each eats in your shop. The split above is a starting hypothesis; one call settles it."
      };
    },
    headline: function (r) {
      return r.freed >= 14 ? "There is most of a full job in here."
           : r.freed >= 7  ? "There is a solid part-time role in here."
           : r.freed >= 3  ? "Smaller than most — but the deadlines still bite."
                           : "Not much, honestly.";
    }
  };
})();

</script>
<script>
/* Shared engine for both wedge landings — Typeform-style: one question a screen,
   letter-keyed answers, keyboard-first, a progress bar pinned to the bottom. The
   page declares window.WEDGE with its questions, task list and arithmetic;
   everything below is presentation. Nothing is sent anywhere until the visitor
   asks for their result to be emailed — at which point the answers, the result and
   the campaign the visit came from (`src`) go with it. */
(function () {
  const W = window.WEDGE;
  /* Where the answers go. A page that sets endpoint: null has nowhere to send
     them — the standalone copies Mostafa opens from a folder — so it ends at
     the result and offers to print instead of asking for an email it cannot
     deliver. */
  const ENDPOINT = W.endpoint === undefined ? "/api/leads" : W.endpoint;
  /* A copy with no endpoint may still send to a Google Sheet: `sheet` is the web
     address of the Apps Script in tools/web/collect.gs. It gets one row per visit:
     the answers and result when the owner reaches the result, and their name and
     email on the same row if they ask for the written result. With neither, the
     owner can copy the numbers; a page inside Claude cannot print. */
  const SHEET = ENDPOINT ? null : (W.sheet || null);
  const LEAD = (function () {
    try { return (new URLSearchParams(location.search).get("lead") || "").slice(0, 40); } catch (e) { return ""; }
  })();
  /* One row per visit, and a visit lasts as long as the browser tab: a reload,
     or coming back to this calculator in the same tab, replaces the same row
     instead of adding one. A different company code is a different visit. */
  const VISIT = (function () {
    const KEY = "wedge_visit_" + W.wedge + "_" + LEAD;
    let v = null;
    try { v = sessionStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
    if (!v) {
      v = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { sessionStorage.setItem(KEY, v); } catch (e) { /* storage blocked */ }
    }
    return v;
  })();
  const CALC = W.name || ({ W1: "Bookkeeping", W2: "Quoting" }[W.wedge]) || W.wedge;
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const A = {};
  const Q = W.questions;
  let step = -1;
  /* Two parts: the first `firstPart` questions share one screen and the figures
     change as they are answered; the rest follow one at a time for anyone who
     wants more. Without it, an intro and one question a screen, as before. */
  const F = W.firstPart > 0 && W.firstPart < Q.length ? W.firstPart : 0;
  let contactFrom = "";      // which screen the email form was opened from
  const touched = new Set(); // part-one answers the visitor set themselves
  document.body.dataset.wedge = W.wedge;
  /* the way home keeps the company code the visitor arrived with */
  if (location.search) document.querySelectorAll("a[data-home]").forEach(a => { a.href = "../" + location.search; });

  /* Where this visitor came from. Read once at load, not at submit: the visitor spends
     nine to eleven screens in here, and by the time they reach the form the query string
     may be gone. Stashed in sessionStorage so a mid-flow reload keeps the attribution.
     Falls back to the referrer host, because a LinkedIn click with no UTMs still says
     something. Every storage access is guarded — private windows throw on both ends. */
  const SRC = (function () {
    const KEY = "wedge_src";
    let stored = null;
    try { stored = sessionStorage.getItem(KEY); } catch (e) { /* storage blocked */ }

    const qs = location.search.replace(/^\?/, "").slice(0, 300);
    let src = qs;
    if (!src) {
      try {
        const h = document.referrer ? new URL(document.referrer).hostname : "";
        if (h && h !== location.hostname) src = "ref=" + h;
      } catch (e) { /* opaque or malformed referrer */ }
    }
    /* A fresh query string wins; otherwise keep whatever the first screen recorded. */
    if (!qs && stored) return stored;
    if (src) { try { sessionStorage.setItem(KEY, src); } catch (e) { /* ignore */ } }
    return src;
  })();

  const val = (q, k) => typeof q[k] === "function" ? q[k](A) : q[k];
  const opts = q => val(q, "options") || [];
  const LETTER = i => String.fromCharCode(65 + i);   // 0 -> A, 1 -> B …

  /* one persistent keyboard router; each screen registers its own actions */
  let onEnter = null, onLetter = null, onBack = null;
  document.addEventListener("keydown", e => {
    const t = document.activeElement, typing = t && /^(INPUT|TEXTAREA)$/.test(t.tagName);
    if (t && t.tagName === "A") return;          // a focused link keeps its own Enter
    if (t && t.closest && t.closest(".live")) return;   // so do the controls on the live screen
    if (e.key === "Enter") { if (onEnter) { e.preventDefault(); onEnter(); } return; }
    if (!typing && e.key.length === 1 && onLetter) {
      const i = e.key.toUpperCase().charCodeAt(0) - 65;
      if (i >= 0 && i < 26 && onLetter(i)) e.preventDefault();
    }
    if (!typing && e.key === "Backspace" && onBack) { e.preventDefault(); onBack(); }
  });

  /* progress bar, created once, lives outside #app */
  const bar = document.createElement("div");
  bar.className = "tfprog"; bar.innerHTML = "<i></i>";
  document.body.appendChild(bar);
  const setProgress = () => {
    let pct = 100;
    if (step < 0) pct = 0;
    else if (step < Q.length) {
      const from = F && step >= F ? F : 0;
      pct = Math.round(((step - from + 1) / (Q.length - from + 1)) * 100);
    }
    bar.firstChild.style.width = pct + "%";
  };

  /* the number so far: a dollar figure on the question screens from the moment
     the answers can carry one, so nobody waits for the last tap to see a number.
     Unanswered questions take the sums' own middle values; it is sent nowhere. */
  let dockWatch = null;      // stops the live card's scroll watch when the screen changes
  const sofar = document.createElement("div");
  sofar.className = "sofar"; sofar.hidden = true; sofar.setAttribute("aria-hidden", "true");
  const sofarSay = document.createElement("p");
  sofarSay.className = "sr"; sofarSay.setAttribute("role", "status");
  document.body.appendChild(sofar); document.body.appendChild(sofarSay);
  const STILL = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  let sofarWas = 0, sofarRaf = 0;
  /* The answers so far, with an unanswered tick-list taking its usual ticks and
     an untouched slider its starting point: the typical answers behind the live
     figures and the number so far. */
  function filled() {
    const a = Object.assign({}, A);
    Q.forEach(q => {
      if (q.type === "multi" && a[q.id] == null) a[q.id] = opts(q).filter(o => o.on !== false).map(o => o.value);
      if (q.slider && a[q.id] == null) a[q.id] = q.slider.start;
    });
    return a;
  }
  /* Finished means every one-at-a-time question answered. On the live screen
     nothing has to be touched: a slider counts at its starting point and an
     unpicked button at the typical answer, as the figures already do. */
  const complete = () => Q.slice(F).every(q => A[q.id] != null);
  /* Before the last answer there is no revenue figure: it needs the job value
     and the lost-work answers, and "Not estimated" would be wrong. */
  function outcome() {
    const r = W.compute(filled());
    if (!complete()) r.extra = null;
    return r;
  }
  function setSoFar() {
    cancelAnimationFrame(sofarRaf);
    if (step < 0 || step >= Q.length) { sofar.hidden = true; sofarSay.textContent = ""; return; }
    let annual = 0;
    try { annual = W.compute(filled()).annual || 0; } catch (e) { annual = 0; }
    if (!(annual > 0)) {
      const at = Q.findIndex(q => q.id === W.numberAfter), left = at < 0 ? 0 : at - step + 1;
      sofarWas = 0; sofar.hidden = left <= 0; sofar.className = "sofar wait";
      sofar.textContent = "Your number in " + left + (left === 1 ? " tap" : " taps");
      sofarSay.textContent = ""; return;
    }
    const fresh = sofar.hidden || sofar.className !== "sofar";
    if (fresh) { sofar.className = "sofar"; sofar.innerHTML = "<span>So far</span><b></b><span>a year</span>"; }
    sofar.hidden = false;
    const out = sofar.querySelector("b"), from = sofarWas, t0 = performance.now();
    sofarWas = annual;
    sofarSay.textContent = "So far, " + money(annual) + " a year.";
    if (STILL || from === annual) { out.textContent = money(annual); return; }
    (function tick(t) {
      const p = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - p, 3);
      out.textContent = money(from + (annual - from) * e);
      if (p < 1) sofarRaf = requestAnimationFrame(tick);
    })(t0);
  }

  function render() {
    onEnter = onLetter = onBack = null;
    if (dockWatch) { dockWatch(); dockWatch = null; }
    saveSoFar(false);          // every move to another screen saves what is answered so far
    if (step < 0) { if (F) renderLive(); else renderIntro(); }
    else if (step < Q.length) renderQ();
    else if (step === Q.length) renderResult();
    else renderContact();
    setProgress();
    setSoFar();
    window.scrollTo({ top: 0, behavior: step > 0 && step <= Q.length ? "auto" : "auto" });
  }

  const screen = (cls, inner) =>
    `<div class="screen ${cls}"><div class="frame">${inner}</div></div>`;

  /* ---------- intro ---------- */
  function renderIntro() {
    document.body.dataset.screen = "intro";
    const start = () => { step = 0; render(); };
    $("#app").innerHTML = screen("intro", `
      <div class="eyebrow">${W.intro.eyebrow}</div>
      <h1>${W.intro.title}</h1>
      <p class="dek">${W.intro.dek}</p>
      <div class="controls">
        <button class="btn" id="start">${W.intro.cta} <span class="en">↵</span></button>
        <span class="hint">press <kbd>Enter ↵</kbd></span>
      </div>
      <p class="fine">${W.intro.fine}</p>`);
    $("#start").addEventListener("click", start);
    onEnter = start;
  }

  /* ---------- questions ---------- */
  function renderQ() {
    document.body.dataset.screen = "q";
    const q = Q[step];
    const note = val(q, "note");
    const advance = () => { step++; render(); };
    const back = () => { step = F && step === F ? -1 : step - 1; render(); };

    const pick = v => {
      A[q.id] = q.numeric ? +v : v;
      if (q.sets) Object.entries(q.sets(v)).forEach(([k, x]) => { A[k] = x; });
      advance();
    };

    let field, controls;
    if (q.type === "number") {
      const v = A[q.id] != null ? A[q.id] : (val(q, "prefill") ?? "");
      field = `<div class="field"><input type="number" inputmode="decimal" id="num" min="0"
                 step="${q.step || 1}" placeholder="${esc(val(q, "placeholder") || "")}"
                 value="${esc(v)}"></div>`;
      controls = okRow();
    } else if (q.type === "multi") {
      const on = A[q.id] || opts(q).filter(o => o.on !== false).map(o => o.value);
      field = optList(q, o => on.includes(o.value));
      controls = okRow();
    } else {
      field = optList(q, o => String(A[q.id]) === String(o.value));
      controls = `<div class="controls">
        <span class="hint">Tap an answer${opts(q).length <= 8 ? ` — or press <kbd>${LETTER(0)}</kbd> … <kbd>${LETTER(opts(q).length - 1)}</kbd>` : ""}</span>
      </div>`;
    }

    $("#app").innerHTML = screen("", `
      <div class="qnum">${step + 1} <span class="arw">→</span></div>
      <div class="q">${val(q, "ask")}</div>
      ${note ? `<p class="note">${note}</p>` : ""}
      ${field}
      ${controls}
      ${step > 0 ? `<div class="controls" style="margin-top:14px"><button class="lnk" id="back">↑ Back</button></div>` : ""}`);

    $("#back")?.addEventListener("click", back);
    if (step > 0) onBack = back;

    if (q.type === "number") {
      const n = $("#num"); n.focus(); n.select?.();
      const go = () => { const x = +n.value; if (!(x >= 0) || n.value === "") return; A[q.id] = x; advance(); };
      $("#ok").addEventListener("click", go);
      onEnter = go;
    } else if (q.type === "multi") {
      if (!A[q.id]) A[q.id] = opts(q).filter(o => o.on !== false).map(o => o.value);
      const toggle = i => {                       // toggle in place — no full re-render, no re-animation
        const o = opts(q)[i]; if (!o) return false;
        const cur = A[q.id];
        A[q.id] = cur.includes(o.value) ? cur.filter(x => x !== o.value) : cur.concat([o.value]);
        const btn = document.querySelector('.opt[data-i="' + i + '"]');
        if (btn) btn.classList.toggle("on", A[q.id].includes(o.value));
        $("#ok").disabled = !A[q.id].length;
        setSoFar();
        return true;
      };
      document.querySelectorAll(".opt").forEach(b => b.addEventListener("click",
        () => toggle(+b.dataset.i)));
      const go = () => { if (A[q.id].length) advance(); };
      $("#ok").addEventListener("click", go);
      $("#ok").disabled = !A[q.id].length;
      onLetter = i => toggle(i);
      onEnter = go;
    } else {
      document.querySelectorAll(".opt").forEach(b =>
        b.addEventListener("click", () => pick(b.dataset.v)));
      onLetter = i => { const o = opts(q)[i]; if (!o) return false; pick(o.value); return true; };
      onEnter = () => { if (A[q.id] != null) advance(); };
    }
  }

  function optList(q, isOn) {
    return `<div class="opts">${opts(q).map((o, i) =>
      `<button class="opt ${isOn(o) ? "on" : ""}" data-v="${esc(o.value)}" data-i="${i}">
         <span class="key">${LETTER(i)}</span>
         <span class="lbl">${esc(o.label)}${o.hint ? `<small>${esc(o.hint)}</small>` : ""}</span>
         <span class="ck" aria-hidden="true">✓</span>
       </button>`).join("")}</div>`;
  }
  const okRow = () => `<div class="controls">
    <button class="btn" id="ok">OK <span class="en">↵</span></button>
    <span class="hint">press <kbd>Enter ↵</kbd></span></div>`;

  /* ---------- result ---------- */
  const money = n => "$" + Math.round(n).toLocaleString("en-CA");
  /* The answers in words, one line a question, for the form and for copying. */
  const strip = s => String(s == null ? "" : s).replace(/<[^>]*>/g, "").replace(/&mdash;/g, "-").replace(/&amp;/g, "&");
  function answersText() {
    const lines = Q.map((q, i) => {
      const v = A[q.id];
      const label = x => { const o = opts(q).find(o => o.value === x); return o ? strip(o.label) : String(x); };
      /* an untouched slider or tick-list still fed the figures, so say what it stood at */
      if (v == null && q.slider) return strip(val(q, "ask")) + " " + q.slider.show(q.slider.start) + " (not changed)";
      if (v == null && q.type === "multi" && i < F) return strip(val(q, "ask")) + " " + filled()[q.id].map(label).join(", ") + " (not changed)";
      if (v == null || (Array.isArray(v) && !v.length)) return null;
      if (q.slider) return strip(val(q, "ask")) + " " + q.slider.show(v);
      return strip(val(q, "ask")) + " " + (Array.isArray(v) ? v.map(label).join(", ") : label(v));
    }).filter(Boolean);
    if (SRC) lines.push("Came from: " + SRC);
    return lines.join("\n");
  }
  function resultText(r) {
    return r.freed.toFixed(1) + " hours a week could come off the desk, worth " + money(r.annual) +
      " a year.\n\n" + answersText();
  }
  /* The site's own function saves the result, then copies it to the Sheet.
     A refusal comes back as an error, so the owner is told it did not send. */
  function payload(stage, r, who) {
    return JSON.stringify(Object.assign({ visit: VISIT, stage, calculator: CALC, lead: LEAD, src: SRC,
      hours: r.freed, monthly: r.monthly, annual: r.annual, total: r.total, residual: r.residual,
      extra: r.extra ? strip(r.extra.value) : "", flags: r.flags.map(f => strip(f.title)).join(" | "),
      answers: answersText() }, who || {}));
  }
  /* Saves go one after another, so a quick run of answers lands in order and
     the last one sent is the one that stays. */
  let queue = Promise.resolve();
  function toSheet(stage, r, who) {
    const body = payload(stage, r, who);
    const send = () => fetch(SHEET, { method: "POST", body, keepalive: true })
      .then(res => { if (!res.ok) throw new Error("not saved"); return res; });
    const sent = queue.then(send, send);
    queue = sent.catch(() => {});
    return sent;
  }
  let sentResult = "";
  /* ---------- part one: its questions on one screen, the figures live ---------- */
  const WORDS = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
  /* Before the result, what is answered so far is saved as stage "first" on
     every move to another screen and when the page is hidden, replacing the
     visit's row; nothing goes before the first answer, and nothing twice for
     the same answers. Someone who already answered everything is not sent back
     to "first": the result and the email form save their own stages. */
  function saveSoFar(leaving) {
    if (!SHEET || !Object.keys(A).length || complete()) return;
    const key = "first" + JSON.stringify(A);
    if (key === sentResult) return;
    sentResult = key;
    if (leaving && navigator.sendBeacon && navigator.sendBeacon(SHEET, payload("first", outcome()))) return;
    toSheet("first", outcome()).catch(() => {});
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveSoFar(true); });
  window.addEventListener("pagehide", () => saveSoFar(true));

  function renderLive() {
    document.body.dataset.screen = "live";
    const part = Q.slice(0, F), more = Q.length - F;
    /* questions from `extra.from` on sit in their own box, as the optional ones */
    const X = W.extra && W.extra.from > 0 && W.extra.from < F ? W.extra.from : F;
    /* the box stays closed until opened, and opens by itself once one of its answers is in */
    const xOpen = Q.slice(X, F).some(q => touched.has(q.id));
    const control = (q, i) => q.slider
      ? `<div class="lq">
          <div class="lq-top"><label for="lq${i}">${val(q, "ask")}</label><output id="lo${i}" for="lq${i}"></output></div>
          <p class="lnote" id="ln${i}"></p>
          <input type="range" id="lq${i}" min="${q.slider.min}" max="${q.slider.max}" step="${q.slider.step}">
        </div>`
      : `<div class="lq" role="group" aria-labelledby="lk${i}">
          <div class="lq-top"><span class="lk" id="lk${i}">${val(q, "ask")}</span></div>
          ${q.type === "multi" && val(q, "note") ? `<p class="lnote">${val(q, "note")}</p>` : ""}
          <div class="chips${q.type === "multi" ? " multi" : ""}" id="lc${i}">${opts(q).map(o =>
            `<button type="button" class="chip" data-v="${esc(o.value)}" aria-pressed="false">${o.chip || o.label}</button>`).join("")}</div>
          <p class="lhint" id="lh${i}"></p>
        </div>`;
    $("#app").innerHTML = screen("tall wide", `
      <div class="eyebrow">${W.intro.eyebrow}</div>
      <h1 class="live-h">${W.intro.title}</h1>
      <p class="live-dek">${W.intro.dek}</p>
      <div class="live">
        <div class="live-in">${part.slice(0, X).map((q, i) => control(q, i)).join("")}${X < F ? `
          <div class="lx">
            <button type="button" class="lx-open" id="lxo" aria-expanded="${xOpen}" aria-controls="lxq">
              <span><span class="lx-h" id="lxh">${W.extra.title}</span><span class="lx-n">${W.extra.note}</span></span>
              <span class="lx-plus" aria-hidden="true">+</span>
            </button>
            <div class="lx-q" id="lxq" role="group" aria-labelledby="lxh"${xOpen ? "" : " hidden"}>
              ${part.slice(X).map((q, j) => control(q, X + j)).join("")}
            </div>
          </div>` : ""}</div>
        <div class="live-side">
        <div class="live-slot"><div class="live-out">
          <div class="ly" id="ly"></div><div class="lab" id="lyl"></div>
          <div class="pair">
            <div><b id="lhw"></b><div class="lab" id="lhl"></div></div>
            <div><b id="lmo"></b><div class="lab" id="lml"></div></div>
          </div>
        </div></div>
        <div class="live-go">
          <p class="note">For everything else we use typical answers.</p>
          ${W.trust ? `<ul class="trust">${W.trust.map(t => `<li><span>${t}</span></li>`).join("")}</ul>` : ""}
          <div class="controls">
            <button class="btn" id="more">${W.more || "Tell me more"} — ${WORDS[more] || more} more taps <span class="en">↵</span></button>
            ${ENDPOINT || SHEET ? `<button class="btn alt" id="send">Email me this</button>`
              : `<button class="btn alt" id="send">Copy my numbers</button>`}
          </div>
          <p class="nosign">No sign-up. No email needed to see your number.</p>
        </div>
        </div>
      </div>
      <p class="sr" role="status" id="lsay"></p>
      <p class="fine">${W.intro.fine}</p>`);

    const paint = () => {
      const a = filled(), r = outcome();
      part.forEach((q, i) => {
        if (q.slider) {
          const s = q.slider, el = $("#lq" + i), v = Math.min(s.max, Math.max(s.min, +a[q.id]));
          if (+el.value !== v) el.value = v;
          el.style.setProperty("--p", ((v - s.min) / (s.max - s.min) * 100) + "%");
          $("#lo" + i).textContent = s.show(v);
          $("#ln" + i).textContent = typeof s.note === "function" ? s.note(A) : (s.note || "");
        } else {
          const picked = q.type === "multi" ? a[q.id].map(String) : A[q.id] != null ? [String(A[q.id])] : [];
          document.querySelectorAll("#lc" + i + " .chip").forEach(b => {
            const on = picked.includes(b.dataset.v);
            b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
          });
          /* their answer said back to them, where the calculator has something to say */
          const o = q.type !== "multi" && A[q.id] != null ? opts(q).find(o => String(o.value) === String(A[q.id])) : null;
          $("#lh" + i).textContent = o && o.hint ? o.hint : "";
        }
      });
      $("#ly").textContent = money(r.annual); $("#lyl").textContent = r.labels.annual;
      $("#lhw").innerHTML = r.freed.toFixed(1) + "<small>h/wk</small>"; $("#lhl").textContent = r.labels.hours;
      $("#lmo").innerHTML = money(r.monthly) + "<small>/month</small>"; $("#lml").textContent = r.labels.monthly;
    };
    /* read out once a control settles, not on every step of a drag */
    const say = () => { $("#lsay").textContent = "About " + money(outcome().annual) + " a year."; };
    part.forEach((q, i) => {
      if (q.slider) {
        const el = $("#lq" + i);
        el.addEventListener("input", () => { A[q.id] = +el.value; touched.add(q.id); paint(); });
        el.addEventListener("change", say);
      } else {
        document.querySelectorAll("#lc" + i + " .chip").forEach(b => b.addEventListener("click", () => {
          const v = b.dataset.v;
          if (q.type === "multi") {
            /* a tick-list starts with its usual ticks, and its last tick stays on */
            const x = opts(q).find(o => String(o.value) === v).value, cur = filled()[q.id];
            const next = cur.includes(x) ? cur.filter(y => y !== x) : cur.concat([x]);
            if (!next.length) return;
            A[q.id] = next;
          } else {
            A[q.id] = q.numeric ? +v : v;
            /* picking who sets a typical rate, unless they already moved the rate */
            if (q.sets) Object.entries(q.sets(v)).forEach(([k, x]) => { if (!touched.has(k)) A[k] = x; });
          }
          touched.add(q.id);
          paint(); say();
        }));
      }
    });
    /* the number so far picks up where the live figure left off, not from $0 */
    const go = () => { sofarWas = outcome().annual; step = F; render(); };
    $("#more").addEventListener("click", go);
    if (X < F) $("#lxo").addEventListener("click", () => {
      const open = $("#lxo").getAttribute("aria-expanded") !== "true";
      $("#lxo").setAttribute("aria-expanded", open); $("#lxq").hidden = !open;
    });
    /* On a phone-width page, close to the top, the card snaps up and stretches
       to the full width with square corners, and settles back into its place on
       the way down; its slot keeps its height, so nothing below it jumps. On a
       wide page it does not dock: the card, the lines and the buttons stick
       together beside the questions and come down with the scroll. */
    const slot = $(".live-slot"), card = $(".live-out"), MAGNET = 40;
    let docked = false, settle = 0;
    const dock = () => {
      const r = card.getBoundingClientRect();
      clearTimeout(settle);
      slot.style.height = r.height + "px";
      Object.assign(card.style, { position: "fixed", zIndex: "40", top: r.top + "px", left: r.left + "px", width: r.width + "px" });
      /* out of the screen's box while at the top: the box's fade-in leaves it
         acting as the frame for anything fixed, so the card would pin to it */
      document.body.appendChild(card);
      void card.offsetWidth;                   // start the move from where it was
      card.classList.add("moving", "docked");
      Object.assign(card.style, { top: "0px", left: "0px", width: "100%" });
      settle = setTimeout(() => card.classList.remove("moving"), 400);
    };
    const undock = () => {
      const s = slot.getBoundingClientRect();
      clearTimeout(settle);
      card.classList.add("moving"); card.classList.remove("docked");
      Object.assign(card.style, { top: s.top + "px", left: s.left + "px", width: s.width + "px" });
      settle = setTimeout(() => {
        card.classList.remove("moving"); card.removeAttribute("style");
        slot.appendChild(card); slot.style.height = "";
      }, 400);
    };
    const narrow = window.matchMedia("(max-width: 860px)");   // the one-column layout
    const check = () => {
      const want = narrow.matches && slot.getBoundingClientRect().top <= MAGNET;
      if (want && !docked) { docked = true; dock(); }
      else if (!want && docked) { docked = false; undock(); }
    };
    window.addEventListener("scroll", check, { passive: true });
    window.addEventListener("resize", check);
    dockWatch = () => {
      window.removeEventListener("scroll", check); window.removeEventListener("resize", check); clearTimeout(settle);
      if (card.parentNode !== slot) card.remove();   // a card at the top leaves with its screen
    };
    check();
    if (ENDPOINT || SHEET) $("#send").addEventListener("click", () => { contactFrom = "live"; step = Q.length + 1; render(); });
    else $("#send").addEventListener("click", () => copyNumbers(outcome()));
    onEnter = go;
    paint();
  }

  function renderResult() {
    document.body.dataset.screen = "result";
    const r = outcome();
    /* The result goes to the sheet once per set of answers, not on every return here. */
    if (SHEET) { const key = "result" + JSON.stringify(A); if (key !== sentResult) { sentResult = key; toSheet("result", r).catch(() => {}); } }
    /* A page that embeds the calculator may keep the result (the offline copy
       files it against the company on the line); nothing here depends on it. */
    if (typeof window.fourtapsResult === "function") { try { window.fourtapsResult(W.wedge, A, r); } catch (e) {} }
    const maxH = Math.max.apply(null, r.bars.map(b => b.hours).concat([0.001]));
    const send = () => { contactFrom = "result"; step++; render(); };
    const back = () => { step = Q.length - 1; render(); };
    $("#app").innerHTML = screen("tall", `
      <div class="qnum">Your numbers</div>
      <h2 style="font-size:clamp(24px,4.6vw,34px);margin:2px 0 0">${W.headline(r)}</h2>

      <div class="three">
        <div><div class="big">${r.freed.toFixed(1)}<small>h/wk</small></div><div class="rlabel">${r.labels.hours}</div></div>
        <div><div class="big">${money(r.monthly)}</div><div class="rlabel">${r.labels.monthly}</div></div>
        <div><div class="big">${money(r.annual)}</div><div class="rlabel">${r.labels.annual}</div></div>
      </div>

      <h3 class="sec">Where the hours go</h3>
      <div class="bars">${r.bars.map(b => `<div class="bar-row">
        <span class="bl">${esc(b.label)}</span>
        <span class="bar-track"><i style="width:${Math.max(2, (b.hours / maxH) * 100)}%"></i></span>
        <span class="bh">${b.hours.toFixed(1)} h</span></div>`).join("")}</div>
      <p class="note" style="margin-top:12px">Out of <b>${r.total.toFixed(0)} hours a week</b> in total,
        <b>${r.residual.toFixed(1)} hours</b> stay with a person — the review, the approvals, the judgement calls.
        ${r.ptline ? `<br>${r.ptline}` : ""}</p>

      ${r.extra ? `<div class="upside"><div class="ul">${r.extra.label}</div><div class="uv">${r.extra.value}</div>
         <div class="un">${r.extra.note}</div></div>` : ""}

      ${r.flags.map(f => `<div class="flag ${f.tone || ""}"><b>${f.title}</b>${f.body}</div>`).join("")}

      <div class="caveat"><b>What this does not know.</b> ${r.caveat}</div>
      <div class="controls">
        ${ENDPOINT || SHEET ? `<button class="btn" id="send">Email me this — with the working shown <span class="en">↵</span></button>`
          : `<button class="btn" id="send">Copy my numbers</button>`}
        <button class="lnk" id="back">↑ Change an answer</button>
      </div>`);
    if (ENDPOINT || SHEET) $("#send").addEventListener("click", send);
    else $("#send").addEventListener("click", () => copyNumbers(r));
    $("#back").addEventListener("click", back);
    onEnter = ENDPOINT || SHEET ? send : null; onBack = back;
  }
  function copyNumbers(r) {
    const text = resultText(r), btn = $("#send");
    const shown = () => {
      if ($("#copied")) return;
      $(".frame").insertAdjacentHTML("beforeend",
        `<textarea id="copied" class="caveat" readonly rows="8" style="width:100%">${esc(text)}</textarea>`);
      $("#copied").select();
    };
    try {
      navigator.clipboard.writeText(text).then(() => { btn.textContent = "Copied"; }, shown);
    } catch (e) { shown(); }
  }

  /* ---------- contact ---------- */
  function renderContact() {
    document.body.dataset.screen = "contact";
    const back = () => { step = contactFrom === "live" ? -1 : Q.length; render(); };
    $("#app").innerHTML = screen("tall", `
      <div class="qnum">Last step</div>
      <div class="q">Where should it go?</div>
      <p class="note">The numbers above with the working shown, and the two things worth
        checking before anyone spends money. No newsletter — you have to ask us for the next thing.</p>
      <div class="fieldrow">
        <input type="text"  id="business" placeholder="Business name" autocomplete="organization">
        <input type="text"  id="contact"  placeholder="Your name" autocomplete="name">
        <input type="email" id="email"    placeholder="Email" autocomplete="email" inputmode="email">
        <input type="tel"   id="phone"    placeholder="Phone (optional)" autocomplete="tel" inputmode="tel">
        <input type="text"  id="website"  tabindex="-1" autocomplete="off" aria-hidden="true"
               style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      </div>
      <div class="controls">
        <button class="btn" id="submit">Send it <span class="en">↵</span></button>
        <button class="lnk" id="back">↑ Back to my numbers</button>
      </div>`);
    $("#business").focus();
    $("#back").addEventListener("click", back);
    onBack = back;

    const submit = async () => {
      const email = $("#email").value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $("#email").focus(); return; }
      const btn = $("#submit"); btn.disabled = true; btn.textContent = "Sending…";
      const r = outcome();
      if (SHEET) return sendToSheet(r, btn, { business: $("#business").value.trim(),
        contact: $("#contact").value.trim(), email, phone: $("#phone").value.trim(),
        website: ($("#website") || {}).value || "" });
      try {
        await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ wedge: W.wedge, business: $("#business").value.trim(),
            contact: $("#contact").value.trim(), email, phone: $("#phone").value.trim(),
            src: SRC, answers: A, result: { freed: r.freed, monthly: r.monthly, annual: r.annual,
                                  residual: r.residual, total: r.total,
                                  flags: r.flags.map(f => f.title),
                                  extra: r.extra ? r.extra.value : null } }) });
        onEnter = onBack = null;
        document.body.dataset.screen = "done";
        $("#app").innerHTML = screen("done", `
          <div class="big">✓</div>
          <h2 style="margin-top:14px">On its way.</h2>
          <p class="note" style="margin-top:10px">We read every one of these ourselves. If your numbers
            look unusual — in either direction — expect a question back rather than a pitch.</p>`);
      } catch (e) {
        btn.disabled = false; btn.textContent = "Send it";
        $(".frame").insertAdjacentHTML("beforeend",
          `<div class="caveat">That didn't send. Try again in a moment, or email us directly.</div>`);
      }
    };
    $("#submit").addEventListener("click", submit);
    onEnter = submit;
  }

  async function sendToSheet(r, btn, who) {
    try {
      await toSheet("contact", r, who);
      onEnter = onBack = null;
      document.body.dataset.screen = "done";
      $("#app").innerHTML = screen("done", `
        <div class="big">✓</div>
        <h2 style="margin-top:14px">Got it.</h2>
        <p class="note" style="margin-top:10px">Mostafa from fourtaps will send your written result,
          usually within one working day. We read every one of these ourselves.</p>`);
    } catch (e) {
      btn.disabled = false; btn.textContent = "Send it";
      if (!$("#notsent")) $(".frame").insertAdjacentHTML("beforeend",
        `<div class="caveat" id="notsent">That didn't send. Check your connection and try again.</div>`);
    }
  }

  render();
})();

</script>
</body>
</html>
